user.signup.agreement.privacy.section1.item2=選択：電話番号、住所
user.signup.agreement.privacy.section2.title=2. 個人情報の収集および利用目的
user.signup.agreement.privacy.section2.content=サービスの提供、会員管理、問い合わせ対応、サービス品質の改善、法的義務の遵守。
user.signup.agreement.privacy.section3.title=3. 個人情報の保有および利用期間
user.signup.agreement.privacy.section3.content=会員退会時に直ちに破棄します。ただし、関連法令に基づき一定期間保管する場合があります。
user.signup.agreement.privacy.section4.title=4. 個人情報の第三者提供
