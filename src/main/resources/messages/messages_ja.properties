# Agreement - Service
user.signup.agreement.service.article1.title=第1条 (目的)
user.signup.agreement.service.article1.content=本規約は、当社が提供するサービスの利用に関して、当社と利用者の権利、義務、および責任事項を規定することを目的とします。
user.signup.agreement.service.article2.title=第2条 (定義)
user.signup.agreement.service.article2.content=本規約で使用する用語の定義は、次のとおりです。<br>1. 「サービス」とは、当社が提供するすべてのオンラインサービスを意味します。<br>2. 「利用者」とは、本規約に基づき当社が提供するサービスを受ける会員および非会員を指します。
user.signup.agreement.service.article3.title=第3条 (規約の効力および変更)
user.signup.agreement.service.article3.content=当社は、関連法令に違反しない範囲で本規約を変更することができ、変更された規約は告知事項を通じて通知します。
user.signup.agreement.service.article4.title=第4条 (会員登録)
user.signup.agreement.service.article4.content=会員登録は、当社が定めた手続きに従って申請し、当社が承諾することによって完了します。
user.signup.agreement.service.article5.title=第5条 (会員の義務)
user.signup.agreement.service.article5.intro=会員は、サービス利用時に次の各号の行為を行ってはなりません。<br>
user.signup.agreement.service.article5.item1=虚偽の情報の提供
user.signup.agreement.service.article5.item2=他人の権利の侵害
user.signup.agreement.service.article5.item3=不法行為およびその他の関連法令違反
user.signup.agreement.service.article6.title=第6条 (当社の義務)
user.signup.agreement.service.article6.content=当社は、安定的なサービスの提供に最善を尽くし、個人情報保護に関する法令を遵守します。
user.signup.agreement.service.article7.title=第7条 (サービス利用の制限)
user.signup.agreement.service.article7.content=当社は、利用者が規約に違反したり、サービスの運営に支障をきたしたりする場合、サービスの利用を制限することができます。
user.signup.agreement.service.article8.title=第8条 (著作権の帰属および利用制限)
user.signup.agreement.service.article8.content=サービスに含まれる著作物の著作権は当社に帰属し、無断での複製および配布を禁止します。
user.signup.agreement.service.article9.title=第9条 (免責条項)
user.signup.agreement.service.article9.content=当社は、天災地変、不可抗力的な事由によるサービスの中断について責任を負いません。
user.signup.agreement.service.article10.title=第10条 (管轄裁判所)
user.signup.agreement.service.article10.content=サービスの利用に関連して紛争が発生した場合、当社所在地を管轄する裁判所を管轄裁判所とします。

