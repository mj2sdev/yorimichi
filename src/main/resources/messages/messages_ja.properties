# Agreement - Location
user.signup.agreement.location.article1.title=第1条 (目的)
user.signup.agreement.location.article1.content=本規約は、「位置情報の保護及び利用等に関する法律」に基づき、当社が位置情報を収集、利用するにあたり、利用者の権利と義務を規定することを目的とします。
user.signup.agreement.location.article2.title=第2条 (収集する位置情報項目)
user.signup.agreement.location.article2.intro=当社は、サービスの提供のために次のような位置情報を収集します。
user.signup.agreement.location.article2.item1=GPSベースの位置情報
user.signup.agreement.location.article2.item2=IPアドレスによる位置情報
user.signup.agreement.location.article2.item3=その他サービス利用過程で生成される位置情報
user.signup.agreement.location.article3.title=第3条 (位置情報の利用目的)
user.signup.agreement.location.article3.intro=収集された位置情報は、次のような目的のために利用されます。
user.signup.agreement.location.article3.item1=カスタマイズされたサービスの提供
user.signup.agreement.location.article3.item2=サービス品質の改善および新規サービスの開発
user.signup.agreement.location.article3.item3=法的義務の履行
user.signup.agreement.location.article4.title=第4条 (保有および利用期間)
user.signup.agreement.location.article4.content=当社は、位置情報を収集した目的の達成時まで保有し、目的達成後は遅滞なく破棄します。ただし、関連法令により保管が必要な場合は、その期間保有します。
user.signup.agreement.location.article5.title=第5条 (第三者提供)
user.signup.agreement.location.article5.content=当社は、利用者の位置情報を原則として第三者に提供せず、法令による場合を除き、利用者の同意を得ます。
user.signup.agreement.location.article6.title=第6条 (利用者の権利)
user.signup.agreement.location.article6.content=利用者は、いつでも位置情報の収集および利用に対する同意を撤回することができ、位置情報の閲覧、訂正、削除を要求することができます。
user.signup.agreement.location.article7.title=第7条 (免責事項)
user.signup.agreement.location.article7.content=当社は、天災地変、不可抗力的な事由により位置情報の提供が遅延したり不可能になったりした場合、それについて責任を負いません。
user.signup.agreement.location.article8.title=第8条 (管轄裁判所)
user.signup.agreement.location.article8.content=位置情報の利用に関連して紛争が発生した場合、当社所在地を管轄する裁判所を管轄裁判所とします。

