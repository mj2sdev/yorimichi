# Agreement - Service
user.signup.agreement.service.article1.title=제1조 (목적)
user.signup.agreement.service.article1.content=이 약관은 회사가 제공하는 서비스의 이용과 관련하여 회사와 이용자의 권리, 의무 및 책임사항을 규정함을 목적으로 합니다.
user.signup.agreement.service.article2.title=제2조 (정의)
user.signup.agreement.service.article2.content=이 약관에서 사용하는 용어의 정의는 다음과 같습니다.<br>1. "서비스"란 회사가 제공하는 모든 온라인 서비스를 의미합니다.<br>2. "이용자"란 본 약관에 따라 회사가 제공하는 서비스를 받는 회원 및 비회원을 말합니다.
user.signup.agreement.service.article3.title=제3조 (약관의 효력 및 변경)
user.signup.agreement.service.article3.content=회사는 관련 법령을 위배하지 않는 범위에서 이 약관을 변경할 수 있으며, 변경된 약관은 공지사항을 통해 고지합니다.
user.signup.agreement.service.article4.title=제4조 (회원 가입)
user.signup.agreement.service.article4.content=회원 가입은 회사가 정한 절차에 따라 신청하고, 회사가 승낙함으로써 완료됩니다.
user.signup.agreement.service.article5.title=제5조 (회원의 의무)
user.signup.agreement.service.article5.intro=회원은 서비스 이용 시 다음 각 호의 행위를 하여서는 안 됩니다.<br>
user.signup.agreement.service.article5.item1=허위 정보 제공
user.signup.agreement.service.article5.item2=타인의 권리 침해
user.signup.agreement.service.article5.item3=불법 행위 및 기타 관련 법령 위반
user.signup.agreement.service.article6.title=제6조 (회사의 의무)
user.signup.agreement.service.article6.content=회사는 안정적인 서비스 제공을 위해 최선을 다하며, 개인정보 보호에 관한 법령을 준수합니다.
user.signup.agreement.service.article7.title=제7조 (서비스 이용 제한)
user.signup.agreement.service.article7.content=회사는 이용자가 약관을 위반하거나 서비스 운영에 지장을 초래할 경우 서비스 이용을 제한할 수 있습니다.
user.signup.agreement.service.article8.title=제8조 (저작권의 귀속 및 이용제한)
user.signup.agreement.service.article8.content=서비스에 포함된 저작물의 저작권은 회사에 귀속되며, 무단 복제 및 배포를 금지합니다.
user.signup.agreement.service.article9.title=제9조 (면책조항)
user.signup.agreement.service.article9.content=회사는 천재지변, 불가항력적 사유로 인한 서비스 중단에 대해 책임을 지지 않습니다.
user.signup.agreement.service.article10.title=제10조 (관할법원)
user.signup.agreement.service.article10.content=서비스 이용과 관련하여 분쟁이 발생할 경우 회사 소재지를 관할하는 법원을 관할법원으로 합니다.

# Agreement - Privacy
user.signup.agreement.privacy.intro=당사는 회원님의 개인정보를 중요시하며, 「개인정보 보호법」 등 관련 법령을 준수하고 있습니다.
user.signup.agreement.privacy.section1.title=1. 수집하는 개인정보 항목
user.signup.agreement.privacy.section1.item1=필수: 이름, 이메일, 비밀번호
user.signup.agreement.privacy.section1.item2=선택: 전화번호, 주소
user.signup.agreement.privacy.section2.title=2. 개인정보의 수집 및 이용 목적
user.signup.agreement.privacy.section2.content=서비스 제공, 회원 관리, 민원 처리, 서비스 품질 개선, 법적 의무 준수.
user.signup.agreement.privacy.section3.title=3. 개인정보의 보유 및 이용 기간
user.signup.agreement.privacy.section3.content=회원 탈퇴 시 즉시 파기. 단, 관련 법령에 따라 일정 기간 보관할 수 있음.
user.signup.agreement.privacy.section4.title=4. 개인정보의 제3자 제공
user.signup.agreement.privacy.section4.content=원칙적으로 외부에 제공하지 않음. 다만 법령에 의해 필요한 경우 예외.
user.signup.agreement.privacy.section5.title=5. 개인정보 보호 책임자
user.signup.agreement.privacy.section5.content=담당자: 홍길동<br>이메일: privacy@example.com

# Agreement - Location
user.signup.agreement.location.article1.title=제1조 (목적)
user.signup.agreement.location.article1.content=이 약관은 위치정보의 보호 및 이용 등에 관한 법률에 따라 회사가 위치정보를 수집, 이용함에 있어 이용자의 권리와 의무를 규정함을 목적으로 합니다.
user.signup.agreement.location.article2.title=제2조 (수집하는 위치정보 항목)
user.signup.agreement.location.article2.intro=회사는 서비스 제공을 위해 다음과 같은 위치정보를 수집합니다.
user.signup.agreement.location.article2.item1=GPS 기반 위치정보
user.signup.agreement.location.article2.item2=IP 주소를 통한 위치정보
user.signup.agreement.location.article2.item3=기타 서비스 이용과정에서 생성되는 위치정보
user.signup.agreement.location.article3.title=제3조 (위치정보의 이용 목적)
user.signup.agreement.location.article3.intro=수집된 위치정보는 다음과 같은 목적을 위해 이용됩니다.
user.signup.agreement.location.article3.item1=맞춤형 서비스 제공
user.signup.agreement.location.article3.item2=서비스 품질 개선 및 신규 서비스 개발
user.signup.agreement.location.article3.item3=법적 의무 이행
user.signup.agreement.location.article4.title=제4조 (보유 및 이용 기간)
user.signup.agreement.location.article4.content=회사는 위치정보를 수집한 목적 달성 시까지 보유하며, 목적 달성 후 지체 없이 파기합니다. 다만, 관련 법령에 의해 보관이 필요한 경우에는 해당 기간 동안 보유합니다.
user.signup.agreement.location.article5.title=제5조 (제3자 제공)
user.signup.agreement.location.article5.content=회사는 이용자의 위치정보를 원칙적으로 제3자에게 제공하지 않으며, 법령에 의한 경우를 제외하고는 이용자의 동의를 받습니다.
user.signup.agreement.location.article6.title=제6조 (이용자의 권리)
user.signup.agreement.location.article6.content=이용자는 언제든지 위치정보 수집 및 이용에 대한 동의를 철회할 수 있으며, 위치정보의 열람, 정정, 삭제를 요구할 수 있습니다.
