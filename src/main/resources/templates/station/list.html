<!DOCTYPE html>
<html th:replace="~{layout/main :: params(~{::head/content()},~{::body/content()})}"
	  xmlns:th="http://www.thymeleaf.org">
<head>
	<title th:text="#{header.station}"></title>

	<link href="/css/station/list.css" rel="stylesheet"/>

	<script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
	<script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>

	<script src="/js/station/page/station-main.js" type="module"></script>
	<script src="/js/station/page/station-list.js" type="module"></script>
</head>
<body>
<div class="container my-4">

	<div class="border-bottom pb-3 mb-4">
		<div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
			<div class="d-flex align-items-center gap-3">
				<h3 class="m-0 fw-bold" th:text="'🚉 ' + #{header.station}"></h3>
			</div>
			<ul class="nav nav-pills" id="station-filter">
				<li class="nav-item">
					<a class="nav-link rounded-pill filter-tab"
					   data-filter="ALL" href="#"
					   th:classappend="${type == null || type.name() == 'ALL'} ? ' active'">
						<i class="bi bi-grid-3x3-gap me-1"></i><span th:text="#{store.list.search.all}"></span>
					</a>
				</li>
				<li class="nav-item">
					<a class="nav-link rounded-pill filter-tab"
					   data-filter="REVIEW" href="#"
					   th:classappend="${type != null && type.name() == 'REVIEW'} ? ' active'">
						<i class="bi bi-chat-dots me-1"></i><span th:text="#{index.popular_stores.store.review}"></span>
					</a>
				</li>
				<li class="nav-item">
					<a class="nav-link rounded-pill filter-tab"
					   data-filter="COEAT" href="#"
					   th:classappend="${type != null && type.name() == 'COEAT'} ? ' active'">
						<i class="bi bi-people me-1"></i><span th:text="#{store.coeat.title}"></span>
					</a>
				</li>
			</ul>
		</div>
	</div>

	<div class="overflow-auto"
		 id="station"
		 style="height:70vh; overflow-y:auto; overflow-x:hidden;"
		 th:data-has-next="${stationSlice?.hasNext}"
		 th:data-next-id="${stationSlice?.nextId}"
		 th:data-size="${stationSlice?.size ?: 10}"
		 th:if="${stationSlice != null and !#lists.isEmpty(stationSlice.items)}">

		<div class="masonry-col">
			<div class="grid-sizer"></div>

			<a class="text-decoration-none grid-item"
			   th:attr="list-id=${item?.id},
						data-type=${item?.type},
						data-store-id=${item?.store?.id ?: item?.coeat?.storeId},
						data-user-id=${item?.user?.id}"
			   th:each="item : ${stationSlice.items}"
			   th:href="${isReview} ? reviewUrl : coeatUrl"
			   th:with="
				isReview=${item?.type?.name() == 'REVIEW'},
				reviewUrl=@{/review/{reviewId}(reviewId=${item?.id})},
				coeatUrl=@{/coeat/{coeatId}(coeatId=${item?.id})}
			   ">

				<div class="card shadow-sm border-0 hover-shadow">
					<div class="card-body p-3 d-flex flex-column">

						<div class="d-flex align-items-start justify-content-between mb-2">
							<div class="d-flex align-items-center gap-2">
								<i class="bi fs-5"
								   th:classappend="${isReview} ? ' bi-chat-square-text-fill text-primary'
															: ' bi-people-fill text-warning'"></i>
								<span class="badge rounded-pill small"
									  th:classappend="${isReview} ? ' bg-primary bg-opacity-10 text-primary'
															: ' bg-warning bg-opacity-10 text-warning'"
									  th:text="${isReview} ? #{index.popular_stores.store.review} : #{store.coeat.title}"></span>

								<span class="badge rounded-pill small"
									  th:classappend="${item?.coeat?.status?.name() == 'OPEN' ? ' bg-success bg-opacity-10 text-success'
										  : (item?.coeat?.status?.name() == 'CLOSED' ? ' bg-secondary bg-opacity-10 text-secondary'
										  : ' bg-danger bg-opacity-10 text-danger')} "
									  th:if="${!isReview and item?.coeat?.status != null}"
									  th:text="${item?.coeat?.status?.name()}">
								</span>
							</div>
							<small class="text-muted rel-time"
								   th:attr="data-iso=${#temporals.format(item?.createdAt, 'yyyy-MM-dd''T''HH:mm:ss')}"
								   th:text="${#temporals.format(item?.createdAt, 'MM/dd HH:mm')}">
							</small>
						</div>

						<div class="ratio-box mb-2" th:if="${item?.image?.url != null}">
							<img th:alt="#{store.list.item.image}" loading="lazy" th:src="${item?.image?.url}">
						</div>

						<div class="mb-2">
							<span class="fw-semibold text-dark small">
								<i class="bi bi-person-circle me-1"></i>
								<span th:text="${item?.user?.nickname ?: '名無し人'}"></span>
								<!-- #{common.anonymous} -->
							</span>
						</div>

						<div class="text-ymsecondary small mb-2 lh-base clamp-2"
							 th:text="${isReview} ? (${item?.review?.content} ?: '') : (${item?.coeat?.title} ?: '')">
						</div>

						<div class="small text-muted mb-2"
							 th:if="${!isReview and item?.coeat?.meetingAt != null}">
							<i class="bi bi-calendar-event me-1"></i>
							<span th:text="${#temporals.format(item?.coeat?.meetingAt, 'MM/dd HH:mm')}"></span>
						</div>


						<div class="text-muted small mb-2 clamp-2"
							 th:if="${!isReview and item?.coeat?.content != null}"
							 th:text="${item?.coeat?.content}">
						</div>

						<div class="mb-2" th:if="${isReview and !#lists.isEmpty(item?.review?.foods)}">
							<div class="d-flex flex-wrap gap-1">
								<span class="badge bg-light text-dark"
									  th:each="food : ${item?.review?.foods}"
									  th:text="${food?.name ?: ''}"></span>
							</div>
						</div>

						<div class="small text-muted mb-1"
							 th:if="${!isReview and (item?.coeat?.capacity != null
									   or item?.coeat?.approvedCount != null
									   or item?.coeat?.appliedCount != null)}">
							<span th:if="${item?.coeat?.capacity != null}">
								<span th:text="#{station.list.coeat.capacity}"></span>
								<span th:text="' ' + ${item.coeat.capacity}"></span>
							</span>
							<span th:if="${item?.coeat?.approvedCount != null}">
								<span th:if="${item?.coeat?.capacity != null}"></span>
								<span th:text="#{station.list.coeat.approved}"></span>
								<span th:text="' ' + ${item.coeat.approvedCount}"></span>
							</span>
							<span th:if="${item?.coeat?.appliedCount != null}">
								<span th:if="${item?.coeat?.capacity != null or item?.coeat?.approvedCount != null}"></span>
								<span th:text="#{station.list.coeat.applied}"></span>
								<span th:text="' ' + ${item.coeat.appliedCount}"></span>
							</span>
						</div>

						<div class="mt-auto d-flex justify-content-between align-items-center small text-muted">
							<div>
								<span th:text="${item?.store?.name ?: '名無し店'}"></span>
								<!-- #{index.featured.store.name} -->
								<span th:if="${item?.address?.roadAddressText != null}"></span>
								<span th:if="${item?.address?.roadAddressText != null}"
									  th:text="${item?.address?.roadAddressText}"></span>

								<span th:if="${isReview and item?.review?.rating != null}"></span>
								<span class="text-warning"
									  th:if="${isReview and item?.review?.rating != null}"
									  th:text="${item.review.rating} + ' ' + #{store.info.rating.unit}"></span>
							</div>

							<div th:if="${!isReview}">
								<span th:if="${item?.coeat?.commentCount != null}">
									<i class="bi bi-chat-dots me-1"></i>
									<span th:text="${item?.coeat?.commentCount}"></span>
								</span>
								<span th:if="${item?.coeat?.commentCount != null and item?.coeat?.viewCount != null}"> · </span>
								<span th:if="${item?.coeat?.viewCount != null}">
									<i class="bi bi-eye me-1"></i>
									<span th:text="${item?.coeat?.viewCount}"></span>
								</span>
							</div>
						</div>

					</div>
				</div>
			</a>
		</div>

		<div aria-hidden="true" class="infinite-sentinel mt-3" id="station-sentinel" style="height:2px;"></div>
	</div>

	<div th:if="${stationSlice == null or #lists.isEmpty(stationSlice.items)}">
		<div class="card border-0 bg-light">
			<div class="card-body text-center py-5">
				<i class="bi bi-inbox display-1 text-muted opacity-50"></i>
				<p class="mt-3 mb-1 fw-medium" th:text="#{station.list.empty.title}"></p>
				<p class="small text-muted mb-0" th:text="#{station.list.empty.subtitle}"></p>
			</div>
		</div>
	</div>

</div>
</body>
</html>
