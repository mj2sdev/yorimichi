<!-- templates/station/list.html -->
<!DOCTYPE html>
<html th:replace="~{layout/main :: params(~{::head/content()},~{::body/content()})}" xmlns:th="http://www.thymeleaf.org">
<head><title>정류장</title></head>
<body>
<div class="container my-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h3 class="m-0">정류장</h3>
    <div class="text-muted small">최신 피드</div>
  </div>

  <div class="list-group">
    <a th:each="it : ${feed}"
       th:href="${it.type == 'REVIEW'} ? @{/store/detail(id=${it.data.storeId})} : @{/coeat/{id}(id=${it.data.id})}"
       class="list-group-item list-group-item-action">
      <div class="d-flex justify-content-between">
        <div>
          <span th:text="${it.type == 'REVIEW' ? '리뷰' : '같이먹기'}">리뷰</span>
          <span class="text-muted small"> · </span>
          <span th:if="${it.type == 'REVIEW'}">
            ★ <span th:text="${it.data.rating}">5</span>
          </span>
        </div>
        <div class="text-muted small" th:text="${#temporals.format(it.createdAt, 'yyyy.MM.dd HH:mm')}">2025.01.01</div>
      </div>
      <div class="text-ymsecondary small mt-1"
           th:text="${it.type == 'REVIEW' ? it.data.content : (it.data.title != null ? it.data.title : it.data.content)}">내용</div>
    </a>
  </div>
</div>
</body>
</html>
