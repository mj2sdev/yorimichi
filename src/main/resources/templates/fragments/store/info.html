<div class="row gap-2 shadow p-4 gx-0">

	<div class="col-12">
		<div id="shop-image-carousel" class="carousel slide">
			<div class="carousel-inner">
				<div
					class="carousel-item"
					th:classappend="${ stat.index == 0 ? 'active' : '' }"
					th:each="item, stat : ${#numbers.sequence(1, 3)}">
					<div class="row gx-0">
						<div class="col-4">
							<img class="w-100" src="https://picsum.photos/280">
						</div>
						<div class="col-4">
							<img class="w-100" src="https://picsum.photos/281">
						</div>
						<div class="col-4">
							<img class="w-100" src="https://picsum.photos/282">
						</div>
					</div>
				</div>
			</div>
			<button class="carousel-control-prev" type="button" data-bs-target="#shop-image-carousel" data-bs-slide="prev">
				<span class="carousel-control-prev-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Previous</span>
			</button>
			<button class="carousel-control-next" type="button" data-bs-target="#shop-image-carousel" data-bs-slide="next">
				<span class="carousel-control-next-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Next</span>
			</button>
		</div>
	</div>

	<div class="col-12">
		<div class="d-flex justify-content-between">
			<h3>가게이름 본점</h3>
			<div>
				<button class="btn btn-outline-secondary">
					<i class="bi bi-heart text-danger"></i>
					<span>
						저장
					</span>
				</button>
				<button class="btn btn-outline-secondary">
					<i class="bi bi-bookmark text-warning"></i>
					<span>
						즐겨찾기
					</span>
				</button>
				<button class="btn btn-outline-secondary">
					<i class="bi bi-share text-info"></i>
					<span>
						공유
					</span>
				</button>
			</div>
		</div>
	</div>

	<div class="col-12">
		<div>
			<i class="bi bi-pin"></i>
			<span>
				대전 광역시 중구 용두동 어쩌구6길 14
			</span>
		</div>
		<div>
			<i class="bi bi-telephone"></i>
			<span>
				010-1234-5678
			</span>
		</div>
		<div>
			<i class="bi bi-watch"></i>
			<a class="text-decoration-none" data-bs-toggle="collapse" href="#collapseOpentime">
				영업중 오늘 (수) 영업시간: 11:00 ~ 22:00
			</a>
			<div class="collapse" id="collapseOpentime">
				<div class="card card-body">

					월요일 영업시간: 11:00 ~ 22:00
				</div>
			</div>
		</div>
	</div>

	<div class="col-12">
		<div class="d-flex gap-1">
			<span>평점 : </span>
			<i class="bi bi-star-fill text-warning"
				th:each="item : ${#numbers.sequence(1, 5)}">
			</i>
			<span th:text="${ 5 } + '점 (' + ${ 142 } + '명의 평가)'">
			</span>
		</div>
	</div>

	<div class="col-12">
		<div class="d-flex gap-2">
			<i class="bi bi-tag"></i>
			<a
				class="text-decoration-none"
				href=""
				th:each="item : ${ {'짜장', '노키즈존', '노짐승존', '흡연쌉가능'} }"
				th:text="${ '#' + item }"></a>
		</div>
	</div>

</div>
