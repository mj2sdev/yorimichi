<div class="row shadow p-4 gx-0 gap-2">

	<h4 th:text="#{store.coeat.title}">
		같이 먹기
	</h4>

	<div class="btn-toolbar justify-content-between">
		<div class="btn-group">
			<input type="checkbox" class="btn-check" id="btncheck1" autocomplete="off">
			<label class="btn btn-outline-secondary btn-sm" for="btncheck1" th:text="#{store.coeat.button.follow_only}">팔로우만</label>

			<input type="checkbox" class="btn-check" id="btncheck2" autocomplete="off">
			<label class="btn btn-outline-secondary btn-sm" for="btncheck2" th:text="#{store.coeat.button.follower_only}">팔로워만</label>
		</div>
		<div class="btn-group">
			<button
				type="button"
				class="btn btn-sm btn-ymprimary"
				data-bs-target="#coeatwriting"
				data-bs-toggle="modal"
				th:text="#{store.coeat.button.create_meeting}">
				같이먹기 작성
			</button>
		</div>
	</div>

	<div
		class="d-flex shadow-sm p-2 justify-content-between align-items-center"
		th:each="item : ${ store.coeats }">
		<th:block th:replace="~{ fragments/common/profile :: userData(${ item.user }) }" />
		<button
			data-bs-toggle="modal"
			data-bs-target="#coeatmodal"
			type="button"
			class="btn btn-sm btn-outline-ymprimary"
			th:data-id="${ item.id }"
			onclick="coeatDetailModal.findOne(event)"
			th:text="#{common.view_detail}"> 상세보기
		</button>
	</div>

</div>
