<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title> Yorimichi Project </title>
</head>

<body>
	<th:block th:fragment="modal">
		<div class="modal fade" id="coeatmodal" tabindex="-1" aria-labelledby="coeatmodalLabel" aria-hidden="true">
			<div class="modal-dialog modal-xl modal-dialog-scrollable modal-dialog-centered">
				<div class="modal-content">
					<div class="modal-header">
						<h1 class="modal-title fs-5" id="coeatmodalLabel">가게이름 같이 먹기 일정: 25.09.11</h1>
						<button class="btn">
							<i class="bi bi-flag-fill" style="font-size: 1em; color: red;"></i>
						</button>
						<button th:if="${#false}" type="button" class="btn btn-sm p-0" data-bs-toggle="modal"
							data-bs-target="#reviewwriting">
							<i class="bi bi-pencil-fill text-ymprimary" style="font-size: 1em;"></i>
						</button>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<div class="container">
							<div class="row">
								<div class="col border border-2">
									<div class="row border-bottom border-2" style="height:300px;">
										<div class="col">
											<img src="">
											지도나 이미지 자리.
										</div>
									</div>
									<div class="row py-3">
										<div class="col">
											<ul>
												<th:block th:each="item : ${#numbers.sequence(1,5)}">
													<div class="row">
														<div class="col">음식이름</div>
														<div class="col">가격</div>
														<div class="col">
															<th:block th:each="item : ${#numbers.sequence(1,5)}">
																<i class="bi bi-star-fill"
																	style="font-size: 1em; color: gold;"></i>
															</th:block>
														</div>
													</div>
												</th:block>
											</ul>
										</div>
									</div>
								</div>
								<div class="col border border-2">
									<div class="row">
										<div class="row">
											<div class="col text-ymprimary">
												<button class="btn fw-bold dropdown-toggle" data-bs-toggle="dropdown"
													aria-expanded="false">개최자</button>
												<ul class="dropdown-menu">
													<li><a class="dropdown-item" href="#"><i class="bi bi-heart"
																style="font-size: 1em;"></i>팔로우</a></li>
													<li th:if="${#false}"><a class="dropdown-item" href="#"><i
																class="bi bi-heart-fill"
																style="font-size: 1em; color: red;"></i>팔로우취소</a></li>
													<li><a class="dropdown-item" href="#"><i class="bi bi-search"
																style="font-size: 1em;"></i> 상세보기</a></li>
												</ul>
											</div>
											<div class="col" th:text="${'간단 자기소개'}">
												사람에 대한 설명
											</div>
										</div>
										<th:block th:each="item : ${#numbers.sequence(1,5)}">
											<div class="row">
												<div class="col text-ymprimary">
													<button class="btn fw-bold dropdown-toggle"
														data-bs-toggle="dropdown" aria-expanded="false">참여자</button>
													<ul class="dropdown-menu">
														<li><a class="dropdown-item" href="#"><i class="bi bi-heart"
																	style="font-size: 1em;"></i>팔로우</a></li>
														<li th:if="${#false}"><a class="dropdown-item" href="#"><i
																	class="bi bi-heart-fill"
																	style="font-size: 1em; color: red;"></i>팔로우취소</a>
														</li>
														<li><a class="dropdown-item" href="#"><i class="bi bi-search"
																	style="font-size: 1em;"></i> 상세보기</a></li>
													</ul>
												</div>
												<div class="col" th:text="${'간단 자기소개'}">
													사람에 대한 설명
												</div>
											</div>
										</th:block>
									</div>
									<div class="row border-top border-3 mt-3">
										<div class="col mt-3">
											만든 사람이 할 말.<br>
											전 어쩌구 저쩌구 하고 싶구요<br>
											뭐 먹으려고 합니다.<br>
											참가조건은 어쩌구
										</div>
									</div>
								</div>
							</div>
							<div class="row mt-3">
								<div class="col">
									<p class="text-center">참가자 대화</p>
									<ul class="list-unstyled">
										<th:block th:each="i : ${#numbers.sequence(1,5)}">
											<li class="my-4 text-start">
												<div class="row justify-content-between">
													<div class="col-4">닉네임</div>
													<div class="col">2025-09-11</div>
												</div>
												<div class="row">
													<div class="col">
														댓글내용
													</div>
												</div>
											</li>
										</th:block>
									</ul>
								</div>
							</div>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
						<button type="button" class="btn btn-primary">참가신청</button>
					</div>
				</div>
			</div>
		</div>
	</th:block>

	<th:block th:fragment="write">
		<div class="modal fade" id="coeatwriting" tabindex="-1" aria-labelledby="coeatwritingLabel" aria-hidden="true">
			<div class="modal-dialog modal-lg modal-dialog-centered">
				<div class="modal-content">
					<div class="modal-header">
						<h1 class="modal-title fs-5" id="coeatwritingLabel">같이먹기 양식</h1>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<div class="my-3">
							<input type="date" class="form-control">
						</div>
						<th:block th:each="menu : ${#numbers.sequence(1,5)}">
							<div class="input-group mb-3">
								<div class="input-group-text">
									<input class="btn form-check-input mt-0" type="checkbox" value=""
										aria-label="Checkbox for following text input">
								</div>
								<ul>
									<div class="row">
										<div class="col">
											<span>음식이름</span>
											<span>3000￦</span>
											<span>
												<th:block th:each="rating : ${#numbers.sequence(1,5)}">
													<i class="bi bi-star-fill" style="font-size: 1em; color: gold;"></i>
												</th:block>
											</span>
										</div>
									</div>
								</ul>
							</div>
						</th:block>

						<div class="input-group">
							<span class="input-group-text">내용</span>
							<input type="text" class="form-control" placeholder="참가자에게 하고 싶은 말을 입력해주세요"
								aria-label="content" aria-describedby="addon-wrapping">
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
						<button type="button" class="btn btn-primary">작성완료</button>
					</div>
				</div>
			</div>
		</div>
	</th:block>

</body>

</html>
