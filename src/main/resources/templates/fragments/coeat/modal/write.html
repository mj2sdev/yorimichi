<div class="modal fade" id="coeatwriting" tabindex="-1" aria-labelledby="coeatwritingLabel" aria-hidden="true">
	<div class="modal-dialog modal-lg modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h1 class="modal-title fs-5" id="coeatwritingLabel">같이먹기 양식</h1>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<div class="my-3">
					<input type="date" class="form-control">
				</div>
				<th:block th:each="menu : ${#numbers.sequence(1,5)}">
					<div class="input-group mb-3">
						<div class="input-group-text">
							<input class="btn form-check-input mt-0" type="checkbox" value=""
								aria-label="Checkbox for following text input">
						</div>
						<ul>
							<div class="row">
								<div class="col">
									<span>음식이름</span>
									<span>3000￦</span>
									<span>
										<th:block th:each="rating : ${#numbers.sequence(1,5)}">
											<i class="bi bi-star-fill" style="font-size: 1em; color: gold;"></i>
										</th:block>
									</span>
								</div>
							</div>
						</ul>
					</div>
				</th:block>

				<div class="input-group">
					<span class="input-group-text">내용</span>
					<input type="text" class="form-control" placeholder="참가자에게 하고 싶은 말을 입력해주세요" aria-label="content"
						aria-describedby="addon-wrapping">
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
				<button type="button" class="btn btn-primary">작성완료</button>
			</div>
		</div>
	</div>
</div>
