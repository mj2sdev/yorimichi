<body>
	<th:block th:fragment="modal">
		<div class="modal fade" id="reviewmodal" tabindex="-1">
			<div class="modal-dialog modal-dialog-centered modal-xl">
				<div class="modal-content">
					<div class="modal-header">
						<h1 class="modal-title fs-5" id="exampleModalLabel" th:text="#{index.featured.store.name}">가게이름</h1>
						<button type="button" class="btn">
							<i class="bi bi-flag-fill text-warning"></i>
						</button>
						<button th:if="${#false}" type="button" class="btn btn-sm p-0" data-bs-toggle="modal"
							data-bs-target="#reviewwriting">
							<i class="bi bi-pencil-fill text-ymprimary" style="font-size: 1em;"></i>
						</button>
						<button type="button" class="btn-close" data-bs-dismiss="modal" th:aria-label="#{common.close}"></button>
					</div>
					<div class="modal-body">
						<div class="container">
							<div class="row">
								<div class="col">
									<div id="carouselExample" class="carousel slide">
										<div class="carousel-inner">
											<div class="carousel-item active">
												<img class="d-block w-100" alt="...">
											</div>
											<div class="carousel-item">
												<img class="d-block w-100" alt="...">
											</div>
											<div class="carousel-item">
												<img class="d-block w-100" alt="...">
											</div>
										</div>
										<button class="carousel-control-prev" type="button"
											data-bs-target="#carouselExample" data-bs-slide="prev">
											<span class="carousel-control-prev-icon" aria-hidden="true"></span>
											<span class="visually-hidden" th:text="#{common.previous}">Previous</span>
										</button>
										<button class="carousel-control-next" type="button"
											data-bs-target="#carouselExample" data-bs-slide="next">
											<span class="carousel-control-next-icon" aria-hidden="true"></span>
											<span class="visually-hidden" th:text="#{common.next}">Next</span>
										</button>
									</div>
								</div>
								<div class="col">
									<div class="row">
										<div class="col">
											<button class="btn fw-bold dropdown-toggle" data-bs-toggle="dropdown"
												aria-expanded="false" th:text="#{review.modal.writer}">작성자</button>
											<ul class="dropdown-menu">
												<li><a class="dropdown-item" href="#"><i class="bi bi-heart"
													style="font-size: 1em;"></i><span class="ms-1" th:text="#{common.follow}">팔로우</span></a></li>
												<li th:if="${#false}"><a class="dropdown-item" href="#"><i
													class="bi bi-heart-fill"
													style="font-size: 1em; color: red;"></i><span class="ms-1" th:text="#{common.unfollow}">팔로우취소</span></a></li>
												<li><a class="dropdown-item" href="#"><i class="bi bi-search"
													style="font-size: 1em;"></i> <span class="ms-1" th:text="#{common.view_detail}">상세보기</span></a></li>
											</ul>
										</div>
										<div class="col">
											25.09.11
										</div>
									</div>
									<th:block th:each="item : ${#numbers.sequence(1,5)}">
										<div class="row"> <div class="col" th:text="#{review.modal.temp.food_name}">
												짜장면
											</div>
											<div class="col" th:text="#{review.modal.temp.food_price}">
												가격
											</div>
											<div class="col">
												<th:block th:each="item : ${#numbers.sequence(1,5)}">
													<i class="bi bi-star-fill" style="font-size: 1em; color: gold;"></i>
												</th:block>
											</div>
										</div>
									</th:block>
								</div>
							</div>
							<div class="row border-top border-3 mt-3">
								<div class="col mt-3" th:text="#{review.modal.temp.content}">
									이 집 물을 잘합니다.
								</div>
							</div>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{common.close}">Close</button>
					</div>
				</div>
			</div>
		</div>
	</th:block>
</body>

</html>
