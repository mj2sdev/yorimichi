<!DOCTYPE html>
<html
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="header">

<header class="border-bottom shadow-sm sticky-top bg-ymwhite">
  <div class="container">
    <div class="row align-items-center py-3 g-2">

      <!-- 로고 : md 이상=가로 락업 / md 미만=아이콘 -->
      <div class="col-12 col-md-3 d-flex align-items-center">
        <a th:href="@{/}" class="d-inline-flex align-items-center text-decoration-none">
          <!-- 데스크톱/태블릿: 가로 락업 -->
          <img src="/image/ym1-logo-horizontal.svg" alt="Yorimichi"
               height="44" class="d-none d-md-inline-block" loading="eager">
          <!-- 모바일: 심벌 -->
          <img src="/image/ym1-symbol.svg" alt="Yorimichi"
               height="40" class="d-inline-block d-md-none" loading="eager">
        </a>
      </div>

      <!-- 검색창 -->
      <div class="col-12 col-md-5">
        <form action="/search" method="get" class="w-100">
          <div class="input-group">
            <span class="input-group-text bg-white border-1">
              <i class="bi bi-search"></i>
            </span>
            <input name="keyword"
                   class="form-control border-1"
                   placeholder="검색어 입력"
                   autocomplete="off">
            <button type="submit" class="btn btn-ymprimary px-3">
              검색
            </button>
          </div>
        </form>
      </div>

      <!-- 오른쪽 메뉴 -->
      <div class="col-12 col-md-4">
        <div class="d-flex justify-content-md-end justify-content-between align-items-center gap-3">

          <!-- 알림 -->
          <a sec:authorize="isAuthenticated()" class="text-decoration-none text-ymsecondary text-center"
            data-bs-toggle="offcanvas"
            data-bs-target="#notification">
            <div class="position-relative">
              <i class="bi bi-lightbulb fs-3"></i>
              <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">99+</span>
            </div>
            <div class="small mt-1">알림</div>
          </a>

          <!-- 정류장 -->
          <a href="/station" class="text-decoration-none text-ymsecondary text-center">
            <i class="bi bi-bus-front fs-3"></i>
            <div class="small mt-1">정류장</div>
          </a>

          <!-- 로그인 (로그인 상태에 따라 교체해서 사용) -->
          <a sec:authorize="isAnonymous()" href="/login" class="text-decoration-none text-ymsecondary text-center">
            <i class="bi bi-door-open fs-3"></i>
            <div class="small mt-1">로그인</div>
          </a>

          <!-- 내정보 (로그인 되었을 경우) -->
          <a sec:authorize="isAuthenticated()" href="/mypage" class="text-decoration-none text-ymsecondary text-center">
            <i class="bi bi-person-circle fs-3"></i>
            <div class="small mt-1">내정보</div>
          </a>

          <a sec:authorize="isAuthenticated()" href="javascript:logoutForm.submit()" class="text-decoration-none text-ymsecondary text-center">
            <i class="bi bi-box-arrow-right fs-3"></i>
            <div class="small mt-1">로그아웃</div>
          </a>
          <form method="post" th:action="@{/logout}" id="logoutForm"></form>

        </div>
      </div>

    </div>
  </div>
</header>

</th:block>
</body>
</html>
