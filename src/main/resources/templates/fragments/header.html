<header class="border-bottom shadow-sm sticky-top bg-ymwhite">
	<div class="container">
		<div class="row justify-content-between align-items-center py-4">
			<!-- 로고 -->
			<div class="col-12 col-lg">
				<a
					th:href="@{/}"
					th:text="Yorimichi"
					class="me-4 text-decoration-none fs-2 fw-bold text-ymprimary"></a>
			</div>

			<!-- 검색  -->
			<div class="col-12 col-lg">
				<form action="/search">
					<div class="input-group">
						<input name="keyword" placeholder="검색어 입력" class="form-control rounded-start-pill" >
						<button type="submit" class="btn btn-ymprimary rounded-end-circle">
							<i class="bi bi-search"></i>
						</button>
					</div>
				</form>
			</div>

			<!-- 네비게이션 -->
			<div class="col-12 col-lg">
				<div class="d-flex justify-content-around">
					<button
						data-bs-toggle="offcanvas"
						data-bs-target="#notification"
						class="btn btn-ghost position-relative"
						type="button">
						<span class="position-absolute top-0 start-50 badge rounded-pill bg-danger">99+</span>
						<i class="bi bi-lightbulb fs-3"></i>
						<div>알림</div>
					</button>

					<a href="/station" class="btn btn-ghost">
						<i class="bi bi-bus-front fs-3"></i>
						<div>정류장</div>
					</a>

					<!-- 로그인 필요 시  -->
					<a href="/login" class="btn btn-ghost">
						<i class="bi bi-door-open fs-3"></i>
						<div>로그인</div>
					</a>

					<!-- 로그인 된 경우 -->
					<a href="/mypage" class="btn btn-ghost" hidden>
						<i class="bi bi-person fs-3"></i>
						<div>내정보</div>
					</a>

				</div>
				
			</div>
		</div>
	</div>
</header>
