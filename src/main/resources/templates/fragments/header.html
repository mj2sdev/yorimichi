<th:block th:fragment="header">
  <header class="border-bottom shadow-sm sticky-top bg-ymwhite">
    <div class="container">
      <div class="row align-items-center py-3 g-2">

        <!-- 로고 -->
        <div class="col-12 col-md-3 d-flex align-items-center">
          <a class="d-inline-flex align-items-center text-decoration-none" th:href="@{/}">
            <!-- 데스크톱/태블릿: 가로 락업 -->
            <img alt="Yorimichi" class="d-none d-md-inline-block" height="44" loading="eager" src="/images/ym1-logo-horizontal.svg" style="transform: scale(1.5);">
            <!-- 모바일: 심벌 -->
            <img alt="Yorimichi" class="d-inline-block d-md-none" height="40" loading="eager" src="/images/ym1-symbol.svg">
          </a>
        </div>

        <!-- 검색창 (오버레이 + 자동완성) -->
        <div class="col-12 col-md-5">
          <form id="search-form" class="w-100 position-relative" role="search" method="get" th:action="@{/search}">
            <div class="input-group">
              <span class="input-group-text bg-white border-1"><i class="bi bi-search"></i></span>
              <input
                id="search-input"
                name="q"
                class="form-control border-1"
                type="search"
                placeholder="検索語入力"
                autocomplete="off"
                th:value="${param.q != null ? param.q[0] : (q != null ? q : '')}" />
              <button type="submit" class="btn btn-ymprimary px-3">検索</button>
            </div>

            <!-- ⬇︎ 자동완성 패널: 한 번만! (중복 금지) -->
            <div id="search-panel" class="search-panel shadow-lg rounded-3 d-none"
                 role="listbox" aria-labelledby="search-input">
              <div class="search-empty text-muted small px-3 py-3 d-none">검색어를 입력해 주세요</div>
              <ul id="search-list" class="list-unstyled mb-0"></ul>
              <div class="search-footer small text-end px-3 py-2 text-muted">
                ↑/↓ 移動 · Enter 洗濯 · Esc 閉じる
              </div>
            </div>
          </form>
        </div>

				<div class="col-12 col-md-4">
					<div class="d-flex justify-content-md-end justify-content-between align-items-center gap-3">

						<a class="text-decoration-none text-ymsecondary text-center" data-bs-target="#notification"
						   data-bs-toggle="offcanvas"
						   onclick="notificationOffcanvas.findAll()"
						   sec:authorize="isAuthenticated()">
							<div class="position-relative" id="notificationCount">
								<i class="bi bi-lightbulb fs-3"></i>
								<span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" v-if="count" v-text="count">99+</span>
							</div>
							<div class="small mt-1" th:text="#{header.notifications}">알림</div>
						</a>

            <!-- 정류장 -->
            <a class="text-decoration-none text-ymsecondary text-center" th:href="@{/station}">
              <i class="bi bi-bus-front fs-3"></i>
              <div class="small mt-1">バス停</div>
            </a>

            <!-- 로그인 (비로그인 시) -->
            <a sec:authorize="isAnonymous()" class="text-decoration-none text-ymsecondary text-center" th:href="@{/login}">
              <i class="bi bi-door-open fs-3"></i>
              <div class="small mt-1">ログイン</div>
            </a>

            <!-- 내정보 (로그인 시) -->
            <a sec:authorize="isAuthenticated()" th:href="@{/user/mypage}" class="text-decoration-none text-ymsecondary text-center">
              <i class="bi bi-person-circle fs-3"></i>
              <div class="small mt-1">マイページ</div>
            </a>

            <!-- 로그아웃 (로그인 시) -->
            <a sec:authorize="isAuthenticated()" href="javascript:logoutForm.submit()" class="text-decoration-none text-ymsecondary text-center">
              <i class="bi bi-box-arrow-right fs-3"></i>
              <div class="small mt-1">ログアウト</div>
            </a>
            <form id="logoutForm" method="post" th:action="@{/logout}"></form>

					</div>
				</div>

      </div>
    </div>
  </header>
</th:block>
