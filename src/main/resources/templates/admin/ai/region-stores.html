<!-- templates/admin/ai/region-stores.html -->
<!doctype html>
<html data-bs-theme="auto" lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>AI · 지역별 맛집 수집</title>

  <!-- CSRF -->
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">

  <!-- ✅ Maps Embed API 키 (컨트롤러에서 model.addAttribute("mapsEmbedKey", ...)로 내려주세요) -->
  <meta name="gmaps-embed-key" th:content="${mapsEmbedKey}" th:if="${mapsEmbedKey}">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
      .nowrap {
          white-space: nowrap;
      }

      code {
          user-select: all;
      }

      .map-embed {
          width: 320px;
          height: 200px;
          border: 0;
          border-radius: .5rem;
          background: #f2f2f2;
      }

      .map-fallback {
          width: 320px;
          height: 200px;
          border-radius: .5rem;
          background: #f8f9fa;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #6c757d;
          font-size: .9rem;
          border: 1px dashed #dee2e6;
      }

      @media (max-width: 992px) {
          .map-embed, .map-fallback {
              width: 240px;
              height: 160px;
          }
      }
  </style>
</head>
<body class="bg-body-tertiary">
<div class="container py-4">
  <h4 class="mb-4">지역 선택</h4>

  <div class="row g-3">
    <!-- 시도 -->
    <div class="col-12 col-md-4">
      <label class="form-label" for="sidoSelect">시도 (필수)</label>
      <select class="form-select" id="sidoSelect" required>
        <option value="">시도를 선택하세요</option>
        <option th:each="sido : ${sidos}" th:text="${sido.name}" th:value="${sido.id}">서울특별시</option>
      </select>
    </div>

    <!-- 시군구 -->
    <div class="col-12 col-md-4">
      <label class="form-label" for="sigunguSelect">시군구 (선택)</label>
      <select class="form-select" disabled id="sigunguSelect">
        <option value="">시군구를 선택하세요</option>
      </select>

      <template id="sigunguOptions">
        <option th:attr="data-sido-id=${sigungu.sidoId}"
                th:each="sigungu : ${sigungus}"
                th:text="${sigungu.name}"
                th:value="${sigungu.id}">유성구
        </option>
      </template>
    </div>

    <!-- 읍면동 -->
    <div class="col-12 col-md-4">
      <label class="form-label" for="emdSelect">읍면동 (선택)</label>
      <select class="form-select" disabled id="emdSelect">
        <option value="">읍면동을 선택하세요</option>
      </select>

      <template id="emdOptions">
        <option th:attr="data-sigungu-id=${emd.sigunguId}"
                th:each="emd : ${emds}"
                th:text="${emd.name}"
                th:value="${emd.id}">봉명동
        </option>
      </template>
    </div>
  </div>

  <div class="row g-3 align-items-end mt-1">
    <div class="col-6 col-md-3">
      <label class="form-label" for="countInput">개수 (1~20)</label>
      <input class="form-control" id="countInput" max="20" min="1" type="number" value="10">
    </div>
    <div class="col-6 col-md-3 d-grid">
      <button class="btn btn-primary" id="queryButton">조회</button>
    </div>
  </div>

  <hr class="my-4">

  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <span>결과</span>
        <span class="badge text-bg-secondary" id="resultCountBadge">0</span>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
        <tr>
          <th style="width:48px"><input disabled id="chkAll" type="checkbox"></th>
          <th style="width:56px">#</th>
          <th>가게명</th>
          <th>시도</th>
          <th>시군구</th>
          <th>읍면동</th>
          <th class="nowrap">Place ID</th>
          <th class="text-center" style="width:340px">지도</th>
        </tr>
        </thead>
        <tbody aria-live="polite" id="resultTableBody">
        <tr class="text-center text-secondary" id="emptyResultRow">
          <td class="py-5" colspan="8">조회 결과가 없습니다.</td>
        </tr>
        <tr class="text-center" id="loadingResultRow" style="display:none;">
          <td class="py-5" colspan="8">
            <div class="d-flex align-items-center justify-content-center gap-2">
              <div aria-hidden="true" class="spinner-border" role="status"></div>
              <strong>로딩중…</strong>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
    // --- Elements ---
    const sidoSelectElement = document.getElementById('sidoSelect');
    const sigunguSelectElement = document.getElementById('sigunguSelect');
    const emdSelectElement = document.getElementById('emdSelect');

    const sigunguOptionsTemplate = document.getElementById('sigunguOptions');
    const emdOptionsTemplate = document.getElementById('emdOptions');

    const countInputElement = document.getElementById('countInput');
    const queryButtonElement = document.getElementById('queryButton');

    const resultTableBodyElement = document.getElementById('resultTableBody');
    const emptyResultRowElement = document.getElementById('emptyResultRow');
    const loadingResultRowElement = document.getElementById('loadingResultRow');
    const resultCountBadgeElement = document.getElementById('resultCountBadge');
    const selectAllCheckboxElement = document.getElementById('chkAll');

    // CSRF
    const csrfHeaderMetaElement = document.querySelector('meta[name="_csrf_header"]');
    const csrfTokenMetaElement = document.querySelector('meta[name="_csrf"]');
    const csrfHeaderName = csrfHeaderMetaElement ? csrfHeaderMetaElement.content.trim() : null;
    const csrfTokenValue = csrfTokenMetaElement ? csrfTokenMetaElement.content.trim() : null;

    // ✅ Embed Key
    const gmapsKeyMeta = document.querySelector('meta[name="gmaps-embed-key"]');
    const GMAPS_EMBED_KEY = gmapsKeyMeta ? gmapsKeyMeta.content.trim() : null;

    // Utils
    function setSelectOptions(selectElement, optionElements, placeholderText) {
        selectElement.innerHTML = '';
        const placeholderOption = document.createElement('option');
        placeholderOption.value = '';
        placeholderOption.textContent = placeholderText || '';
        selectElement.appendChild(placeholderOption);
        optionElements.forEach(opt => selectElement.appendChild(opt.cloneNode(true)));
        selectElement.selectedIndex = 0;
    }

    function escapeHtml(text) {
        return String(text ?? '').replace(/[&<>"']/g, ch => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));
    }

    async function postJson(url, payload) {
        const headers = {'Content-Type': 'application/json', 'Accept': 'application/json'};
        if (csrfHeaderName && csrfTokenValue) headers[csrfHeaderName] = csrfTokenValue;
        const res = await fetch(url, {method: 'POST', headers, body: JSON.stringify(payload)});
        if (res.status === 204) return true;
        if (!res.ok) {
            let msg = res.statusText || '요청 실패';
            try {
                const err = await res.json();
                msg = err?.message || err?.error || msg;
            } catch {
                try {
                    msg = await res.text();
                } catch {
                }
            }
            throw new Error(`${res.status} ${msg}`);
        }
        const ct = res.headers.get('content-type') || '';
        return ct.includes('application/json') ? res.json() : res.text();
    }

    function setResultsLoading(isLoading) {
        queryButtonElement.dataset.originalText ??= queryButtonElement.textContent;
        queryButtonElement.textContent = isLoading ? '조회중…' : queryButtonElement.dataset.originalText;
        queryButtonElement.disabled = isLoading;
        selectAllCheckboxElement.disabled = true;

        if (isLoading) {
            resultTableBodyElement.innerHTML = '';
            loadingResultRowElement.style.display = '';
            resultTableBodyElement.appendChild(loadingResultRowElement);
            resultCountBadgeElement.textContent = '0';
        } else {
            loadingResultRowElement.style.display = 'none';
        }
    }

    // 옵션 캐시
    const allSigunguOptionElements = [...sigunguOptionsTemplate.content.querySelectorAll('option')];
    const allEmdOptionElements = [...emdOptionsTemplate.content.querySelectorAll('option')];

    function initAllSelects() {
        setSelectOptions(sigunguSelectElement, allSigunguOptionElements, '시군구를 선택하세요');
        setSelectOptions(emdSelectElement, allEmdOptionElements, '읍면동을 선택하세요');
        sigunguSelectElement.disabled = false;
        emdSelectElement.disabled = false;
    }

    initAllSelects();

    // 캐스케이딩 필터
    sidoSelectElement.addEventListener('change', () => {
        const selectedSidoId = sidoSelectElement.value;

        if (!selectedSidoId) {
            setSelectOptions(sigunguSelectElement, allSigunguOptionElements, '시군구를 선택하세요');
            setSelectOptions(emdSelectElement, allEmdOptionElements, '읍면동을 선택하세요');
            sigunguSelectElement.disabled = false;
            emdSelectElement.disabled = false;
            return;
        }

        const filteredSigungu = allSigunguOptionElements
            .filter(opt => String(opt.dataset.sidoId) === String(selectedSidoId));
        setSelectOptions(sigunguSelectElement, filteredSigungu, '시군구를 선택하세요');

        const filteredEmd = allEmdOptionElements.filter(opt => {
            const sigunguIdOfEmd = opt.dataset.sigunguId;
            const sigunguOpt = allSigunguOptionElements.find(o => o.value === sigunguIdOfEmd);
            return sigunguOpt && String(sigunguOpt.dataset.sidoId) === String(selectedSidoId);
        });
        setSelectOptions(emdSelectElement, filteredEmd, '읍면동을 선택하세요');

        sigunguSelectElement.disabled = false;
        emdSelectElement.disabled = false;
    });

    sigunguSelectElement.addEventListener('change', () => {
        const selectedSigunguId = sigunguSelectElement.value;

        if (!selectedSigunguId) {
            const selectedSidoId = sidoSelectElement.value;
            if (selectedSidoId) {
                const filteredEmd = allEmdOptionElements.filter(opt => {
                    const sigunguIdOfEmd = opt.dataset.sigunguId;
                    const sigunguOpt = allSigunguOptionElements.find(o => o.value === sigunguIdOfEmd);
                    return sigunguOpt && String(sigunguOpt.dataset.sidoId) === String(selectedSidoId);
                });
                setSelectOptions(emdSelectElement, filteredEmd, '읍면동을 선택하세요');
            } else {
                setSelectOptions(emdSelectElement, allEmdOptionElements, '읍면동을 선택하세요');
            }
            emdSelectElement.disabled = false;
            return;
        }

        const filteredEmd = allEmdOptionElements
            .filter(opt => String(opt.dataset.sigunguId) === String(selectedSigunguId));
        setSelectOptions(emdSelectElement, filteredEmd, '읍면동을 선택하세요');
        emdSelectElement.disabled = false;
    });

    // ====== 임베드 전용 로직 ======
    // Place ID 대략적 패턴(ChIJ로 시작, 길이 보정)
    const PLACE_ID_RE = /^Ch[Ii][A-Za-z0-9_-]{8,}$/;

    // ✅ 임베드 src 생성: Place → Search → 불가(null)
    function buildEmbedSrcFromPlaceIdOrSearch({placeId, name, sido, sigungu, emd}) {
        if (!GMAPS_EMBED_KEY) return null;

        let id = (placeId || '').trim();
        if (id.startsWith('places/')) id = id.slice(7); // "places/ChIJ..." → "ChIJ..."

        if (PLACE_ID_RE.test(id)) {
            // 정확한 장소 임베드
            return `https://www.google.com/maps/embed/v1/place` +
                `?key=${encodeURIComponent(GMAPS_EMBED_KEY)}` +
                `&q=place_id:${encodeURIComponent(id)}` +
                `&zoom=16&language=ko`;
        }

        // 검색 임베드 폴백 (q가 비면 에러이므로 안전 가드)
        const query = [name, sido, sigungu, emd].filter(Boolean).join(' ').trim();
        if (query) {
            return `https://www.google.com/maps/embed/v1/search` +
                `?key=${encodeURIComponent(GMAPS_EMBED_KEY)}` +
                `&q=${encodeURIComponent(query)}` +
                `&zoom=16&language=ko`;
        }

        return null; // 임베드 불가
    }

    // 렌더
    function renderResultRows(rows) {
        resultTableBodyElement.innerHTML = '';

        if (!Array.isArray(rows) || rows.length === 0) {
            resultTableBodyElement.appendChild(emptyResultRowElement);
            resultCountBadgeElement.textContent = '0';
            selectAllCheckboxElement.checked = false;
            selectAllCheckboxElement.disabled = true;
            return;
        }

        rows.forEach((row, index) => {
            const name = row.storeName ?? '';
            const sido = row.sidoName ?? '';
            const sigungu = row.sigunguName ?? '';
            const emd = row.emdName ?? '';
            const placeId = row.placeId ?? '';

            const embedSrc = buildEmbedSrcFromPlaceIdOrSearch({
                placeId, name, sido, sigungu, emd
            });

            const tr = document.createElement('tr');
            tr.innerHTML = `
        <td><input type="checkbox" class="row-select-checkbox"></td>
        <td class="text-secondary">${index + 1}</td>
        <td class="cell-name"><strong>${escapeHtml(name)}</strong></td>
        <td class="cell-sido">${escapeHtml(sido)}</td>
        <td class="cell-sigungu">${escapeHtml(sigungu)}</td>
        <td class="cell-emd">${escapeHtml(emd)}</td>
        <td class="cell-placeid"><code>${escapeHtml(placeId)}</code></td>
        <td class="text-center">
          ${
                embedSrc
                    ? `<iframe class="map-embed" title="지도 미리보기"
                         loading="eager" referrerpolicy="no-referrer-when-downgrade"
                         src="${embedSrc}"></iframe>`
                    : `<div class="map-fallback">임베드 불가 (키/검색어 확인)</div>`
            }
        </td>
      `;

            resultTableBodyElement.appendChild(tr);
        });

        resultCountBadgeElement.textContent = String(rows.length);
        selectAllCheckboxElement.checked = false;
        selectAllCheckboxElement.disabled = false;
    }

    // 조회
    queryButtonElement.addEventListener('click', async () => {
        const selectedSidoId = sidoSelectElement.value;
        const selectedSigunguId = sigunguSelectElement.value || null;
        const selectedEmdId = emdSelectElement.value || null;

        if (!selectedSidoId) {
            alert('시도를 선택하세요.');
            return;
        }

        let requestedCount = Number(countInputElement.value || 10);
        requestedCount = Math.min(Math.max(requestedCount, 1), 20);

        const requestBody = {
            sidoId: Number(selectedSidoId),
            sigunguId: selectedSigunguId ? Number(selectedSigunguId) : null,
            emdId: selectedEmdId ? Number(selectedEmdId) : null,
            count: requestedCount
        };

        try {
            setResultsLoading(true);
            // 서버는 [{storeName,sidoName,sigunguName,emdName,placeId}] 반환
            const responseRows = await postJson('/admin/ai/region-stores', requestBody);
            renderResultRows(responseRows);
        } catch (error) {
            if (String(error.message || '').startsWith('401')) {
                alert('인증이 필요합니다 (401). 로그인 후 다시 시도하세요.');
            } else if (String(error.message || '').startsWith('403')) {
                alert('접근이 거부되었습니다 (403).');
            } else {
                alert('요청 실패: ' + (error.message || '알 수 없는 오류'));
            }
        } finally {
            setResultsLoading(false);
        }
    });

    // 전체 선택
    selectAllCheckboxElement.addEventListener('change', () => {
        const checked = selectAllCheckboxElement.checked;
        document.querySelectorAll('.row-select-checkbox').forEach(cb => cb.checked = checked);
    });
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
