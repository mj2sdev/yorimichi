<!-- templates/admin/index.html -->
<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>管理ダッシュボード</title>

  <!-- CSRF -->
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<div class="container py-4">

  <!-- 헤더 영역 -->
  <header class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h1 class="h3 mb-1">管理ダッシュボード</h1>
      <p class="text-muted small mb-0">
        管理向けツールやバッチ処理をまとめたページです。
      </p>
    </div>
    <a class="btn btn-outline-secondary btn-sm" th:href="@{/}">
      サイトへ
    </a>
  </header>

  <!-- 섹션 제목 -->
  <div class="d-flex align-items-center justify-content-between mb-2">
    <h2 class="h6 text-uppercase text-muted mb-0">AI / バッチツール</h2>
  </div>

  <!-- 카드 그리드 -->
  <div class="row g-3">

    <!-- 地域別グルメ収集 -->
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 border-0 shadow-sm">
        <div class="card-body d-flex flex-column">
          <div class="d-flex align-items-center mb-2">
            <span class="badge rounded-pill text-bg-primary me-2">AI</span>
            <h3 class="h6 mb-0">地域別グルメ収集</h3>
          </div>
          <p class="text-muted small mb-3 flex-grow-1">
            Google Search / Maps を用いて店舗候補を取得し、
            詳細情報をDBに保存します。
          </p>
          <div class="d-flex justify-content-between align-items-center small text-muted mb-2">
            <span>ステップ 1</span>
            <span>店舗一覧 + 詳細</span>
          </div>
          <a class="btn btn-primary btn-sm w-100" th:href="@{/admin/places/search}">
            開く
          </a>
        </div>
      </div>
    </div>

    <!-- レビュー要約 -->
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 border-0 shadow-sm">
        <div class="card-body d-flex flex-column">
          <div class="d-flex align-items-center mb-2">
            <span class="badge rounded-pill text-bg-success me-2">テキスト</span>
            <h3 class="h6 mb-0">レビュー要約</h3>
          </div>
          <p class="text-muted small mb-3 flex-grow-1">
            新着・バックログのレビューを要約し、
            <code>store.summary_review</code> を更新します。
          </p>
          <div class="d-flex justify-content-between align-items-center small text-muted mb-2">
            <span>ステップ 2</span>
            <span>要約 / ダイジェスト</span>
          </div>
          <a class="btn btn-primary btn-sm w-100" th:href="@{/admin/reviews/summary}">
            開く
          </a>
        </div>
      </div>
    </div>

    <!-- レビュー・キーワード抽出 -->
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 border-0 shadow-sm">
        <div class="card-body d-flex flex-column">
          <div class="d-flex align-items-center mb-2">
            <span class="badge rounded-pill text-bg-warning me-2">実験</span>
            <h3 class="h6 mb-0">レビュー・キーワード抽出</h3>
          </div>
          <p class="text-muted small mb-3 flex-grow-1">
            レビューから特徴語を抽出し、タグ化・集計を行う実験的ツールです。
          </p>
          <div class="d-flex justify-content-between align-items-center small text-muted mb-2">
            <span>ステップ 3</span>
            <span>タグ / 集計</span>
          </div>
          <a class="btn btn-primary btn-sm w-100" th:href="@{/admin/reviews/keywords}">
            開く
          </a>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
