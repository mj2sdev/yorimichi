<!DOCTYPE html>
<html th:replace="~{layout/layout :: layout(~{::title},~{::section},~{::script})}" xmlns:th="http://www.thymeleaf.org">

<head>
    <title> Yorimichi Project </title>
</head>

<body>
    <section>
        <div class="container ">
            <div class="row justify-content-center">
                <div class="col-1 text-center">
                    <button type="button" class="btn">
                        <i class="bi bi-heart" style="font-size: 2em; color: red;"></i>
                    </button>
                    <p>팔로우</p>
                </div>
                <div class="col-4 text-center fs-1">
                    찬
                </div>
                <div class="col-1 text-center">
                    <button type="button" class="btn">
                        <i class="bi bi-x-circle" style="font-size: 2em;"></i>
                    </button>
                    <p>차단</p>
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-4 text-center">
                    3ll37023@gmail.com
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-8 text-center">
                    <img src="https://picsum.photos/300" class="mx-auto border rounded-circle">
                </div>
            </div>
            <div class="row justify-content-center text-center">
                <div class="col-4">
                    팔로우
                </div>
                <div class="col-4">
                    팔로워
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-8 border border-3">
                    <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="pills-home-tab" data-bs-toggle="pill"
                                data-bs-target="#pills-home" type="button" role="tab" aria-controls="pills-home"
                                aria-selected="true">
                                리뷰
                            </button>
                        </li>
                    </ul>
                    <div class="tab-content" id="pills-tabContent">
                        <div class="tab-pane fade show active" id="pills-home" role="tabpanel"
                            aria-labelledby="pills-home-tab" tabindex="0">
                            <th:block th:each="reviewItem : ${#numbers.sequence(1,5)}">
                                <div class="row bg-ymwhite mb-3">
                                    <div class="col-3 border">
                                        <span>이미지</span>
                                    </div>
                                    <div class="col-9 border">
                                        <div class="row justify-content-between align-items-center">
                                            <div class="col-auto dropdown">
                                                <button class="btn fw-bold dropdown-toggle" data-bs-toggle="dropdown"
                                                    aria-expanded="false">작성자</button>
                                                <ul class="dropdown-menu">
                                                    <li><a class="dropdown-item" href="#"><i class="bi bi-heart"
                                                                style="font-size: 1em;"></i>팔로우</a></li>
                                                    <li th:if="${#false}"><a class="dropdown-item" href="#"><i
                                                                class="bi bi-heart-fill"
                                                                style="font-size: 1em; color: red;"></i>팔로우취소</a></li>
                                                    <li><a class="dropdown-item" href="#"><i class="bi bi-search"
                                                                style="font-size: 1em;"></i> 상세보기</a></li>
                                                </ul>
                                            </div>
                                            <div class="col">
                                                <span th:each="star : ${#numbers.sequence(1,5)}">
                                                    <i class="bi bi-star-fill" style="font-size: 1em; color: gold;"></i>
                                                </span>
                                            </div>
                                            <div class="col-auto">
                                                2025.09.15
                                            </div>
                                            <div class="col-auto">
                                                <button type="button" class="btn btn-sm p-0" data-bs-toggle="modal"
                                                    data-bs-target="#reportModal">
                                                    <i class="bi bi-flag-fill" style="font-size: 1em; color: red;"></i>
                                                </button>
                                                <button th:if="${#false}" type="button" class="btn btn-sm p-0"
                                                    data-bs-toggle="modal" data-bs-target="#reviewwriting">
                                                    <i class="bi bi-pencil-fill text-ymprimary"
                                                        style="font-size: 1em;"></i>
                                                </button>
                                            </div>
                                        </div>
                                        <div class="p-2" data-bs-toggle="collapse"
                                            th:attr="data-bs-target='#menu' + ${reviewItem}">
                                            <div class="row mt-2">
                                                <div class="col">
                                                    리뷰 본문 내용...
                                                </div>
                                            </div>
                                        </div>
                                        <div class="collapse" th:id="'menu' + ${reviewItem}">
                                            <div class="card card-body">
                                                메뉴 내용...
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </th:block>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </section>
</body>

</html>
