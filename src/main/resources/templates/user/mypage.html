<!DOCTYPE html>
<html th:replace="~{layout/clean :: params(~{::head/content()},~{::body/content()})}" xmlns:th="http://www.thymeleaf.org">

<head>
	<title> Yorimichi Project </title>
</head>

<body>
	<form name="myinfo">
		<div class="container my-4">
			<div class="row">
				<div class="col-9">
					<div class="row mb-3 justify-content-center">
						<div class="text-center col-8">
							<button type="button" id="myinfosubmit" class="btn btn-ymprimary">정보 수정</button>
						</div>
					</div>
					<div class="row justify-content-center">
						<div class="col-4 text-center fs-1">
							<ul class="list-unstyled">
								<li>
									<input type="text" name="nickname" th:value="${user.nickname}" class="form-control text-center"
										aria-label="Username" aria-describedby="addon-wrapping">
								</li>
								<li class="fs-5 bg-ymwhitesmoke form-control" th:text="${user.email}">
									user.email@example.com
								</li>
							</ul>
						</div>
					</div>
					<div class="row my-4 justify-content-center">
						<div class="col-8 text-center">
							<img th:src="${user.image != null ? user.image : '/images/default-profile.png'}" class="mx-auto border rounded-circle">
						</div>
					</div>
					<div class="row justify-content-center">
						<div class="col-8">
							<div class="input-group mb-3">
								<input type="file" name="userImage" value="" class="form-control" id="inputGroupFile02">
								<label class="input-group-text" for="inputGroupFile02">업로드</label>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="modal fade" id="privacy" tabindex="-1" aria-labelledby="privacyLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h1 class="modal-title fs-5" id="privacyLabel">개인 정보 보호 설정</h1>
					</div>
					<div class="modal-body">
						<div class="form-check form-switch">
							<input type="hidden" name="reviewPrivacy" value="false">
							<input class="form-check-input" type="checkbox" role="switch" 
								id="review-privacy" 
								name="reviewPrivacy" 
								value="true" 
								th:checked="${user.reviewPrivate}">
							<label class="form-check-label" for="review-privacy">
								리뷰 비공개
							</label>
						</div>
						<div class="form-check form-switch">
							<input type="hidden" name="likePrivacy" value="false">
							<input class="form-check-input" type="checkbox" role="switch" 
								id="like-privacy" 
								name="likePrivacy" 
								value="true" 
								th:checked="${user.likePrivate}">
							<label class="form-check-label" for="like-privacy">
								좋아요 비공개
							</label>
						</div>
						<div class="form-check form-switch">
							<input type="hidden" name="bookmarkPrivacy" value="false">
							<input class="form-check-input" type="checkbox" role="switch" 
								id="bookmark-privacy" 
								name="bookmarkPrivacy" 
								value="true" 
								th:checked="${user.bookmarkPrivate}">
							<label class="form-check-label" for="bookmark-privacy">
								즐겨찾기 비공개
							</label>
						</div>
						<div class="form-check form-switch">
							<input type="hidden" name="followPrivacy" value="false">
							<input class="form-check-input" type="checkbox" role="switch" 
								id="follow-privacy" 
								name="followPrivacy" 
								value="true" 
								th:checked="${user.followPrivate}">
							<label class="form-check-label" for="follow-privacy">
								팔로우 비공개
							</label>
						</div>
						<div class="form-check form-switch">
							<input type="hidden" name="followerPrivacy" value="false">
							<input class="form-check-input" type="checkbox" role="switch" 
								id="follower-privacy" 
								name="followerPrivacy" 
								value="true" 
								th:checked="${user.followerPrivate}">
							<label class="form-check-label" for="follower-privacy">
								팔로워 비공개
							</label>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-primary" data-bs-dismiss="modal">창 닫기</button>
					</div>
				</div>
			</div>
		</div>
	</form>
	<div class="container">
		<div class="row justify-content-center">
			<div class="col-8 my-4 border border-3">
				<nav>
					<div class="nav nav-tabs" id="nav-tab-main" role="tablist">
						<button class="nav-link active" id="nav-review-tab" data-bs-toggle="tab"
							data-bs-target="#nav-review" type="button" role="tab"
							aria-controls="nav-review" aria-selected="true">
							리뷰
						</button>
						<button class="nav-link" id="nav-like-tab" data-bs-toggle="tab"
							data-bs-target="#nav-like" type="button" role="tab" aria-controls="nav-like"
							aria-selected="false">
							좋아요
						</button>
						<button class="nav-link" id="nav-bookmark-tab" data-bs-toggle="tab"
							data-bs-target="#nav-bookmark" type="button" role="tab"
							aria-controls="nav-bookmark" aria-selected="false">
							즐겨찾기
						</button>
						<button type="button" class="btn text-ymprimary" data-bs-toggle="modal"
							data-bs-target="#privacy">
							<i class="bi bi-key-fill" style="font-size: 1em; color: gold;">
								공개설정
							</i>
						</button>
					</div>
				</nav>
				<div class="tab-content" id="nav-tabContent-main">
					<div class="tab-pane fade show active" id="nav-review" role="tabpanel"
						aria-labelledby="nav-review-tab" tabindex="0">
						<th:block th:each="review : ${reviews}">
							<div class="row bg-ymwhite mb-3">
								<div class="col-3 border">
									<img th:src="'https://picsum.photos/'+${review.images[0]}" style="height:100%; width:100%;">
								</div>
								<div class="col-9 border">
									<div class="row justify-content-between align-items-center">
										<div class="col">
											<div class="star-rating-container">
												<span th:each="i : ${#numbers.sequence(1, 5)}">
													<th:block th:switch="true">
														<i th:case="${i <= review.rating}" class="bi bi-star-fill" style="font-size: 1em; color: gold;"></i>
														<i th:case="${i - 0.5 <= review.rating}" class="bi bi-star-half" style="font-size: 1em; color: gold;"></i>
														<i th:case="*" class="bi bi-star" style="font-size: 1em; color: gold;"></i>
													</th:block>
												</span>
											</div>
										</div>
										<div class="col-auto">
											<a th:href="@{'/store/detail/'+${review.storeId}}"
												class="text-ymprimary text-decoration-none">
												가게보기
											</a>
										</div>
										<div class="col-auto" th:text="#temporals.format(${review.createdAt, 'yyyy.MM.dd'})">
											2025.09.15
										</div>
										<div class="col-auto">
											<button type="button" class="btn btn-sm p-0"
												data-bs-toggle="modal" data-bs-target="#reviewwriting"
												th:data-review-id="${review.reviewId}"
												th:data-review-content="${review.content}">
												<i class="bi bi-pencil-fill text-ymprimary" style="font-size: 1em;"></i>
											</button>
										</div>
										<div class="col-auto">
											<button type="button" class="delete-review-btn btn btn-sm p-0" 
											th:data-review-id="${review.reviewId}">
												<i class="bi bi-trash text-ymprimary" style="font-size: 1em;"></i>
											</button>
										</div>
									</div>
									<div class="p-2" data-bs-toggle="collapse"
										th:attr="data-bs-target='#menu' + ${review.reviewId}">
										<div class="row mt-2">
											<div class="col" th:text="${review.content}">
												리뷰 본문 내용...
											</div>
										</div>
									</div>
									<div class="collapse" th:id="'menu' + ${review.reviewId}">
										<div class="card card-body">
											<th:block th:each="food : ${review.foods}">
												<span th:text="${food}"></span>
											</th:block>
										</div>
									</div>
								</div>
							</div>
						</th:block>
					</div>
					<div class="tab-pane fade" id="nav-like" role="tabpanel"
						aria-labelledby="nav-like-tab" tabindex="1">
						<th:block th:each="like : ${likes}">
							<div class="row">
								<div class="col-2">
									<button type="button" class="btn like-switch-btn" th:data-like-storeId="${like.storeId}">
										<i class="bi bi-heart-fill" style="font-size: 1em; color: red;"></i>
									</button>
								</div>
								<div class="col">
									<a th:href="@{'/store/detail/'+${like.storeId}}" class="btn">
										<img th:src="${like.images[0]}">
										<span th:text="${like.name}">가게명</span>
										<span th:text="${like.address}">위치</span>
										<th:block th:each="category: ${like.categories}">
											<span th:text="${category}">#태그</span>
										</th:block>
									</a>
								</div>
							</div>
						</th:block>
					</div>
					<div class="tab-pane fade" id="nav-bookmark" role="tabpanel"
						aria-labelledby="nav-bookmark-tab" tabindex="1">
						<th:block th:each="bookmark : ${bookmarks}">
							<div class="row">
								<div class="col-2">
									<button type="button" class="bookmark-switch-btn" th:data-bookmark-storeId="${bookmark.storeId}">
										<i class="bi bi-bookmark-fill" style="font-size: 1em; color: gold"></i>
									</button>
								</div>
								<div class="col">
									<a th:href="@{'/store/detail/'+${bookmark.storeId}}" class="btn">
										<img th:src="${bookmark.images[0]}">
										<span th:text="${bookmark.name}">가게명</span>
										<span th:text="${bookmark.address}">위치</span>
										<th:block th:each="category: ${bookmark.categories}">
											<span th:text="${category}">#태그</span>
										</th:block>
									</a>
								</div>
							</div>
						</th:block>
					</div>
				</div>
			</div>
			<div class="col-3 border border-3 overflow-auto" style="height:400px; top: 145px;">
				<nav>
					<div class="nav nav-tabs" id="nav-tab-side" role="tablist">
						<button class="nav-link active" id="nav-follow-tab" data-bs-toggle="tab"
							data-bs-target="#nav-follow" type="button" role="tab" aria-controls="nav-follow"
							aria-selected="true">
							팔로우
						</button>
						<button class="nav-link" id="nav-follower-tab" data-bs-toggle="tab"
							data-bs-target="#nav-follower" type="button" role="tab" aria-controls="nav-follower"
							aria-selected="false">
							팔로워
						</button>
						<button class="nav-link" id="nav-block-tab" data-bs-toggle="tab"
							data-bs-target="#nav-block" type="button" role="tab" aria-controls="nav-block"
							aria-selected="false">
							차단목록
						</button>
					</div>
				</nav>
				<div class="tab-content" id="nav-tabContent-side">
					<div class="tab-pane fade show active" id="nav-follow" role="tabpanel"
						aria-labelledby="nav-follow-tab" tabindex="0">
						<th:block th:each="person : ${followees}">
							<div class="row">
								<div class="col-2">
									<button type="button" class="btn follow-switch-btn" th:data-user-id="${person.userId}">
										<i class="bi bi-heart-fill" style="font-size: 1em; color:red"></i>
									</button>
								</div>
								<div class="col">
									<a th:href="@{'/user/detail/'+${person.userId}}" th:text="${person.nickname}" class="btn d-block">
										닉네임
									</a>
								</div>
							</div>
						</th:block>
					</div>
					<div class="tab-pane fade" id="nav-follower" role="tabpanel"
						aria-labelledby="nav-follower-tab" tabindex="0">
						<th:block th:each="person : ${followers}">
							<div class="row">
								<div class="col-2">
									<i class="bi bi-toggle-on" style="font-size: 1em; color:gold;"></i>
								</div>
								<div class="col">
									<a th:href="@{'/user/detail/'+${person.userId}}" th:text="${person.nickname}" class="btn d-block">
										닉네임
									</a>
								</div>
							</div>
						</th:block>
					</div>
					<div class="tab-pane fade" id="nav-block" role="tabpanel" aria-labelledby="nav-block-tab"
						tabindex="0">
						<th:block th:each="person : ${blocks}">
							<div class="row">
								<div class="col-2">
									<button type="button" class="btn block-switch-btn" th:data-user-id="${person.userId}">
										<i class="bi bi-toggle-on" style="font-size: 1em; color:red;"></i>
									</button>
								</div>
								<div class="col">
									<a th:href="@{'/user/detail/'+${person.userId}}" th:text="${person.nickname}" class="btn d-block">
										닉네임
									</a>
								</div>
							</div>
						</th:block>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
