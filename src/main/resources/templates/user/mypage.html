<!DOCTYPE html>
<html th:replace="~{layout/main :: params(~{::head/content()},~{::body/content()})}" xmlns:th="http://www.thymeleaf.org">

<head>
	<script defer src="/js/user/mypage/myinfo.js"></script>
	<title th:text="#{header.my_info}"> 내 정보 </title>
</head>

<body>
	<div class="container mb-5">
		<div class="row my-4 g-4">
			<!-- Profile Card -->
			<div class="col-lg-4">
				<div class="card shadow-sm">
					<div class="card-body text-center">
						<form name="myinfo" id="myinfo-form">
							<label for="inputGroupFile02" class="position-relative">
								<img th:src="${user.image != null ? user.image : '/images/default-profile.png'}"
									 th:alt="#{user.mypage.label.profile_image}"
									 class="rounded-circle img-fluid border" style="width: 150px; height: 150px; object-fit: cover; cursor: pointer;">
								<span class="position-absolute bottom-0 end-0 bg-light rounded-circle p-1 lh-1">
									<i class="bi bi-camera-fill"></i>
								</span>
							</label>
							<input type="file" name="rawImage" class="d-none" id="inputGroupFile02">

							<input type="text" name="nickname" th:value="${user.nickname}" class="form-control text-center fs-4 fw-bold border-0 mt-3"
								   th:aria-label="#{user.mypage.label.username}" aria-describedby="addon-wrapping">

							<p class="text-muted mb-1" th:text="${user.email}"></p>

							<textarea name="description" th:text="${user.description}" class="form-control text-center text-muted border-0"
									  th:aria-label="#{user.mypage.label.description}" aria-describedby="addon-wrapping" rows="2"></textarea>

							<div class="d-flex justify-content-center gap-2 mt-4">
								<button type="button" id="myinfosubmit" class="btn btn-ymprimary" th:text="#{user.mypage.button.edit_info}">정보 수정</button>
								<button type="button" class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#privacy">
									<i class="bi bi-gear-fill"></i> <span th:text="#{user.mypage.tab.privacy_settings}"></span>
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>

			<!-- Tab Content -->
			<div class="col-lg-8">
				<div class="card shadow-sm">
					<div class="card-header bg-white border-bottom">
						<ul class="nav nav-pills nav-fill" id="nav-tab-main" role="tablist">
							<li class="nav-item" role="presentation">
								<button class="nav-link active" id="nav-review-tab" data-bs-toggle="tab" data-bs-target="#nav-review" type="button" role="tab" aria-controls="nav-review" aria-selected="true" th:text="#{user.mypage.tab.reviews}"></button>
							</li>
							<li class="nav-item" role="presentation">
								<button class="nav-link" id="nav-like-tab" data-bs-toggle="tab" data-bs-target="#nav-like" type="button" role="tab" aria-controls="nav-like" aria-selected="false" th:text="#{user.mypage.tab.likes}"></button>
							</li>
							<li class="nav-item" role="presentation">
								<button class="nav-link" id="nav-bookmark-tab" data-bs-toggle="tab" data-bs-target="#nav-bookmark" type="button" role="tab" aria-controls="nav-bookmark" aria-selected="false" th:text="#{user.mypage.tab.bookmarks}"></button>
							</li>
							<li class="nav-item" role="presentation">
								<button class="nav-link" id="nav-follow-tab" data-bs-toggle="tab" data-bs-target="#nav-follow" type="button" role="tab" aria-controls="nav-follow" aria-selected="false" th:text="#{common.follow}"></button>
							</li>
							<li class="nav-item" role="presentation">
								<button class="nav-link" id="nav-follower-tab" data-bs-toggle="tab" data-bs-target="#nav-follower" type="button" role="tab" aria-controls="nav-follower" aria-selected="false" th:text="#{common.follower}"></button>
							</li>
							<li class="nav-item" role="presentation">
								<button class="nav-link" id="nav-block-tab" data-bs-toggle="tab" data-bs-target="#nav-block" type="button" role="tab" aria-controls="nav-block" aria-selected="false" th:text="#{user.mypage.tab.blocks}"></button>
							</li>
						</ul>
					</div>
					<div class="card-body">
						<div class="tab-content" id="nav-tabContent-main">
							<!-- Reviews Tab -->
							<div class="tab-pane fade show active" id="nav-review" role="tabpanel" aria-labelledby="nav-review-tab" tabindex="0">
								<div class="d-flex flex-column gap-3">
									<th:block th:each="review : ${user.reviews}">
										<div class="card">
											<div class="row g-0">
												<div class="col-md-3">
													<div class="ratio ratio-1x1">

														<img th:if="${!#lists.isEmpty(review.images)}" th:src="${review.images[0]?.url}" class="img-fluid rounded-start w-100 h-100" style="object-fit: cover;" th:alt="#{store.list.item.image}">
														<div th:unless="${!#lists.isEmpty(review.images)}" class="d-flex align-items-center justify-content-center bg-light h-100 rounded-start">
															<i class="bi bi-image-alt fs-1 text-muted"></i>
														</div>
													</div>
												</div>
												<div class="col-md-9">
													<div class="card-body d-flex flex-column h-100">
														<div class="d-flex justify-content-between align-items-start">
															<div>
																<div class="star-rating-container">
																	<span th:each="i : ${#numbers.sequence(1, 5)}">
																		<th:block th:switch="true">
																			<i th:case="${i <= review.rating}" class="bi bi-star-fill text-warning"></i>
																			<i th:case="${i - 0.5 <= review.rating}" class="bi bi-star-half text-warning"></i>
																			<i th:case="*" class="bi bi-star text-warning"></i>
																		</th:block>
																	</span>
																</div>
																<small class="text-muted" th:text="${#temporals.format(review.createdAt, 'yyyy.MM.dd')}"></small>
															</div>
															<div class="d-flex gap-2">
																<a th:href="@{'/store/detail/'+${review.storeId}}" class="btn btn-sm btn-outline-ymprimary" th:text="#{user.detail.button.view_store}"></a>
																<button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#reviewwriting" th:data-review-id="${review.id}" th:data-review-content="${review.content}" th:aria-label="#{common.edit}">
																	<i class="bi bi-pencil-fill"></i>
																</button>
																<button type="button" class="delete-review-btn btn btn-sm btn-outline-danger" th:data-review-id="${review.id}" th:aria-label="#{common.delete}">
																	<i class="bi bi-trash"></i>
																</button>
															</div>
														</div>
														<p class="card-text mt-2 flex-grow-1" th:text="${review.content}"></p>
														<div th:if="${review.foods != null and !#lists.isEmpty(review.foods)}">
															<th:block th:each="food, iterStat : ${review.foods}">
																<span class="badge bg-light text-dark" th:text="${food}"></span>
															</th:block>
														</div>
													</div>
												</div>
											</div>
										</div>
									</th:block>
								</div>
							</div>

							<!-- Likes Tab -->
							<div class="tab-pane fade" id="nav-like" role="tabpanel" aria-labelledby="nav-like-tab" tabindex="1">
								<div class="list-group">
									<th:block th:each="like : ${user.likes}">
										<div class="list-group-item d-flex justify-content-between align-items-center">
											<a th:href="@{'/store/detail/'+${like.id}}" class="text-decoration-none text-dark flex-grow-1">
												<div class="fw-bold" th:text="${like.name} ?: #{index.featured.store.name}"></div>
												<small class="text-muted" th:text="${like.address} ?: #{common.location}"></small>
												<div>
													<th:block th:each="category: ${like.categories}">
														<span class="badge bg-secondary" th:text="${category}"></span>
													</th:block>
												</div>
											</a>
											<button type="button" class="btn btn-sm like-switch-btn" th:data-like-storeId="${like.id}">
												<i class="bi bi-heart-fill fs-5 text-danger"></i>
											</button>
										</div>
									</th:block>
								</div>
							</div>

							<!-- Bookmarks Tab -->
							<div class="tab-pane fade" id="nav-bookmark" role="tabpanel" aria-labelledby="nav-bookmark-tab" tabindex="2">
								<div class="list-group">
									<th:block th:each="bookmark : ${user.bookmarks}">
										<div class="list-group-item d-flex justify-content-between align-items-center">
											<a th:href="@{'/store/detail/'+${bookmark.id}}" class="text-decoration-none text-dark flex-grow-1">
												<div class="fw-bold" th:text="${bookmark.name} ?: #{index.featured.store.name}"></div>
												<small class="text-muted" th:text="${bookmark.address} ?: #{common.location}"></small>
												<div>
													<th:block th:each="category: ${bookmark.categories}">
														<span class="badge bg-secondary" th:text="${category}"></span>
													</th:block>
												</div>
											</a>
											<button type="button" class="btn btn-sm bookmark-switch-btn" th:data-bookmark-storeId="${bookmark.id}">
												<i class="bi bi-bookmark-fill fs-5 text-warning"></i>
											</button>
										</div>
									</th:block>
								</div>
							</div>

							<!-- Follow Tab -->
							<div class="tab-pane fade" id="nav-follow" role="tabpanel" aria-labelledby="nav-follow-tab" tabindex="3">
								<div class="list-group">
									<th:block th:each="person : ${user.followees}">
										<div class="list-group-item d-flex justify-content-between align-items-center">
											<a th:href="@{'/user/detail/'+${person.id}}" class="text-decoration-none text-dark fw-bold" th:text="${person.nickname} ?: #{user.signup.nickname}"></a>
											<button type="button" class="btn btn-sm follow-switch-btn" th:data-user-id="${person.id}">
												<i class="bi bi-heart-fill fs-5 text-danger"></i>
											</button>
										</div>
									</th:block>
								</div>
							</div>

							<!-- Follower Tab -->
							<div class="tab-pane fade" id="nav-follower" role="tabpanel" aria-labelledby="nav-follower-tab" tabindex="4">
								<div class="list-group">
									<th:block th:each="person : ${user.followers}">
										<div class="list-group-item d-flex justify-content-between align-items-center">
											<a th:href="@{'/user/detail/'+${person.id}}" class="text-decoration-none text-dark fw-bold" th:text="${person.nickname} ?: #{user.signup.nickname}"></a>
											<!-- 팔로워에 대한 액션이 필요하다면 여기에 버튼 추가 -->
										</div>
									</th:block>
								</div>
							</div>

							<!-- Block Tab -->
							<div class="tab-pane fade" id="nav-block" role="tabpanel" aria-labelledby="nav-block-tab" tabindex="5">
								<div class="list-group">
									<th:block th:each="person : ${user.blocks}">
										<div class="list-group-item d-flex justify-content-between align-items-center">
											<a th:href="@{'/user/detail/'+${person.id}}" class="text-decoration-none text-dark fw-bold" th:text="${person.nickname} ?: #{user.signup.nickname}"></a>
											<button type="button" class="btn btn-sm btn-outline-danger block-switch-btn" th:data-user-id="${person.id}" th:aria-label="#{user.mypage.button.toggle_block}">
												<i class="bi bi-slash-circle"></i> <span th:text="#{common.unfollow}"></span>
											</button>
										</div>
									</th:block>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Privacy Modal -->
	<div class="modal fade" id="privacy" tabindex="-1" aria-labelledby="privacyLabel" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h1 class="modal-title fs-5" id="privacyLabel" th:text="#{user.mypage.privacy_settings.title}"></h1>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<div class="list-group list-group-flush">
						<div class="list-group-item d-flex justify-content-between align-items-center">
							<label class="form-check-label" for="show-reviews" th:text="#{user.mypage.privacy_settings.reviews}"></label>
							<div class="form-check form-switch">
								<input class="form-check-input" type="checkbox" role="switch" id="show-reviews" name="showReviews" value="true" th:checked="${user.showReviews}" form="myinfo-form">
								<input type="hidden" name="showReviews" value="false" form="myinfo-form">
							</div>
						</div>
						<div class="list-group-item d-flex justify-content-between align-items-center">
							<label class="form-check-label" for="show-likes" th:text="#{user.mypage.privacy_settings.likes}"></label>
							<div class="form-check form-switch">
								<input class="form-check-input" type="checkbox" role="switch" id="show-likes" name="showLikes" value="true" th:checked="${user.showLikes}" form="myinfo-form">
								<input type="hidden" name="showLikes" value="false" form="myinfo-form">
							</div>
						</div>
						<div class="list-group-item d-flex justify-content-between align-items-center">
							<label class="form-check-label" for="show-bookmarks" th:text="#{user.mypage.privacy_settings.bookmarks}"></label>
							<div class="form-check form-switch">
								<input class="form-check-input" type="checkbox" role="switch" id="show-bookmarks" name="showBookmarks" value="true" th:checked="${user.showBookmarks}" form="myinfo-form">
								<input type="hidden" name="showBookmarks" value="false" form="myinfo-form">
							</div>
						</div>
						<div class="list-group-item d-flex justify-content-between align-items-center">
							<label class="form-check-label" for="show-followees" th:text="#{user.mypage.privacy_settings.followees}"></label>
							<div class="form-check form-switch">
								<input class="form-check-input" type="checkbox" role="switch" id="show-followees" name="showFollowees" value="true" th:checked="${user.showFollowees}" form="myinfo-form">
								<input type="hidden" name="showFollowees" value="false" form="myinfo-form">
							</div>
						</div>
						<div class="list-group-item d-flex justify-content-between align-items-center">
							<label class="form-check-label" for="show-followers" th:text="#{user.mypage.privacy_settings.followers}"></label>
							<div class="form-check form-switch">
								<input class="form-check-input" type="checkbox" role="switch" id="show-followers" name="showFollowers" value="1" th:checked="${user.showFollowers}" form="myinfo-form">
								<input type="hidden" name="showFollowers" value="0" form="myinfo-form">
							</div>
						</div>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{common.close}"></button>
					<button type="button" class="btn btn-ymprimary" data-bs-dismiss="modal" th:text="#{common.save}"></button>
				</div>
			</div>
		</div>
	</div>

	<!-- Review Edit/Write Modal (기존에 있다면 여기에 위치) -->
	<!-- <div th:replace="~{fragments/review/modal/write :: reviewWritingModal}"></div> -->

</body>
</html>
