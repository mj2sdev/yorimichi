<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/main :: params(~{::head/content()},~{::body/content()})}"
>
<head>
  <title>Yorimichi Project</title>

  <!-- 인덱스 전용 스크립트 -->
  <script defer src="/js/index/feed.js"></script>
  <script defer src="/js/index/storelist.js"></script>

  <!-- (옵션) 서버가 내려주는 이미지 배열 주입 -->
  <script th:inline="javascript">
  /*<![CDATA[*/
  window.__IMAGE_URLS__ = /*[[${imageUrls}]]*/ [];
  /*]]>*/
  </script>
</head>

<body>
  <!-- ===================== Hero ===================== -->
<!-- Compact & Simple Hero (glass 제거 버전) -->
<div class="hero-compact hero-spacious mb-4">
  <div class="container">
    <div class="hero-stack text-center"><!-- 중앙 고정 -->
      <h1 class="hero-title-sm m-0">내 주변 맛집을 빠르게 찾아보세요</h1>
      <p class="hero-sub-sm mt-2 mb-0">
        카테고리·리뷰·정류장 피드를 한곳에서. 오늘의 인기 가게도 바로 확인!
      </p>

      <!-- KPIs -->
<!-- Bento stats -->
<div class="stats-bento">
  <!-- 누적 리뷰 -->
  <div class="stat-card">
    <div class="stat-head">
      <span class="stat-icon"><i class="bi bi-star-fill"></i></span>
      <span>누적 리뷰</span>
    </div>
    <div>
      <span class="stat-value"
            th:attr="data-value=${stats != null ? stats.reviewCount : 12843}">12843</span>
      <span class="stat-unit">리뷰</span>
    </div>
  </div>

  <!-- 등록 가게 -->
  <div class="stat-card">
    <div class="stat-head">
      <span class="stat-icon"><i class="bi bi-shop"></i></span>
      <span>등록 가게</span>
    </div>
    <div>
      <span class="stat-value"
            th:attr="data-value=${stats != null ? stats.storeCount : 8021}">8021</span>
      <span class="stat-unit">곳</span>
    </div>
  </div>

  <!-- 오늘의 댓글 (또는 새 글) -->
  <div class="stat-card">
    <div class="stat-head">
      <span class="stat-icon"><i class="bi bi-chat-dots"></i></span>
      <span>오늘의 새 글</span>
    </div>
    <div>
      <span class="stat-value"
            th:attr="data-value=${stats != null ? stats.todayComments : 57}">57</span>
      <span class="stat-unit">개</span>
    </div>
  </div>
</div>

    </div>
  </div>

  <!-- Wave Divider (유지) -->
  <div class="hero-wave">
    <svg viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true">
      <path fill="white" d="M0,32 C240,72 480,-8 720,12 C960,32 1200,76 1440,20 L1440,60 L0,60 Z"></path>
    </svg>
  </div>
</div>


  <!-- ===================== 상단 3열: 카테고리 / 추천 / 미니정류장 ===================== -->
  <!-- ★ 세 칸 동일 높이 감(align-items-stretch) -->
  <div class="container">
    <div class="row g-3 align-items-stretch row-tight"><!-- ★ -->

      <!-- 좌: 카테고리 -->
      <!-- ★ equal-rail 로 동일 높이 / rail-scroll 로 내부 스크롤 -->
      <div class="col-12 col-lg-4">
        <div class="card cat-card p-3 equal-rail rail-compact"><!-- ★ equal-rail -->
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="m-0 fw-bold cat-title">카테고리로 이동</h5>
            <a href="/category/list" class="small cat-link">전체보기</a>
          </div>

          <div class="d-grid gap-2 rail-scroll"
               th:if="${popularCategories != null and !#lists.isEmpty(popularCategories)}"><!-- ★ rail-scroll -->
            <a th:each="c : ${popularCategories}"
               th:href="@{/store/list(categoryId=${c.id})}"
               class="cat-btn">
              <span>•</span>
              <span class="fw-normal" th:text="${c.name}">카테고리명</span>
              <i class="bi bi-chevron-right"></i>
            </a>
          </div>

          <div class="text-muted small"
               th:if="${popularCategories == null or #lists.isEmpty(popularCategories)}">
            아직 등록된 카테고리가 없어요.
          </div>

          <hr class="my-3">

          <a href="/store/list" class="btn btn-ymprimary w-100">
            더 다양한 즐거움을 발견해요
          </a>
        </div>
      </div>

      <!-- 중: 추천(Featured) -->
      <!-- ★ equal-rail 로 동일 높이, 이미지 높이는 CSS에서 비율로 제어 -->
      <div class="col-12 col-lg-4">
        <div class="featured p-3 equal-rail rail-compact"><!-- ★ equal-rail -->
          <a th:if="${recommendedStoreList != null and !#lists.isEmpty(recommendedStoreList)}"
             th:href="@{/store/detail(id=${recommendedStoreList[0].id})}"
             class="d-block text-decoration-none">
            <img class="thumb mb-3 skeleton" th:src="${heroImageUrl}" alt="featured"/>
            <div class="fs-3 fw-bold text-ymprimary"
                 th:text="${recommendedStoreList[0].name}">가게이름</div>
            <div class="meta mt-1"
                 th:text="${recommendedStoreList[0].address != null ? recommendedStoreList[0].address.roadAddressText : '주소 정보 없음'}">
              주소
            </div>
            <div class="meta mt-1"
                 th:text="${recommendedStoreList[0].phone != null ? recommendedStoreList[0].phone : '전화번호 없음'}">
              전화
            </div>
            <div class="d-flex align-items-center gap-2 mt-2">
              <span class="badge-ym">추천</span>
              <span class="star">★ ★ ★ ★ ★</span>
            </div>
          </a>

          <div class="text-muted small"
               th:if="${recommendedStoreList == null or #lists.isEmpty(recommendedStoreList)}">
            아직 인기 상점 데이터가 없습니다 🥲
          </div>
        </div>
      </div>

      <!-- 우: 미니 정류장 -->
      <!-- ★ equal-rail 로 동일 높이 / rail-scroll 로 내부 스크롤 -->
      <div class="col-12 col-lg-4">
        <div class="card-ym p-3 mini-station equal-rail rail-compact"><!-- ★ equal-rail -->
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="fw-bold">정류장에서 더 많은 사람과 만나요</div>
            <a href="/station" class="btn btn-sm btn-ymprimary">전체보기</a>
          </div>
          <div id="mini-station" class="list-group list-group-flush rail-scroll"><!-- ★ rail-scroll -->
            <!-- feed.js 가 채움 -->
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- ===================== 하단: 인기 맛집 그리드 ===================== -->
  <div class="container my-3">
    <div class="text-center mb-3">
      <h2 class="fw-bold text-ymprimary">인기 맛집</h2>
      <div class="text-muted">리뷰/별점/조회수를 기반으로 추천해요</div>
    </div>

    <div class="store-grid">
      <!-- 서버에서 미리 그려줄 수 있을 때 (없어도 JS가 picsum으로 채움) -->
      <th:block th:if="${recommendedStoreList != null and !#lists.isEmpty(recommendedStoreList)}"
                th:each="store, iter : ${recommendedStoreList}">
        <a th:href="@{/store/detail(id=${store.id})}" class="text-decoration-none">
          <div class="store-card">
            <img class="thumb"
                 th:if="${imageUrls != null and !#lists.isEmpty(imageUrls)}"
                 th:src="${imageUrls[iter.index % imageUrls.size()]}" alt="store image"/>

            <!-- 이미지 배열 없으면 lazy 로드 + 더미 -->
            <img class="thumb lazy"
                 th:if="${imageUrls == null or #lists.isEmpty(imageUrls)}"
                 data-src="https://picsum.photos/seed/yorimichi__${iter.index}/600/400"
                 alt="store image"/>

            <div class="name" th:text="${store.name}">가게이름</div>
            <div class="addr"
                 th:text="${store.address != null ? store.address.roadAddressText : '주소 없음'}">주소</div>
            <div class="desc" th:text="${store.description}">설명</div>

            <div class="d-flex align-items-center gap-2 mt-2">
              <span class="star">★</span><span class="text-muted small">4.5</span>
              <span class="text-muted small">·</span><span class="text-muted small">123 리뷰</span>
            </div>
          </div>
        </a>
      </th:block>
    </div>
  </div>
</body>
</html>
