<!DOCTYPE html>
<html th:replace="~{layout/clean :: params(~{::head/content()},~{::body/content()})}" xmlns:th="http://www.thymeleaf.org">

<head>
	<title> Yorimichi Project </title>
<script>

</script>
</head>

<body>
	<th:block th:replace="~{ layout/header }"/>
	<h1 th:text="${message}">Welcome!</h1>
	<section>
		<div class="bg-ymprimary py-5 bg-gradient">
			<div class="container-fluid">
				<div class="row">
					<div class="col text-center">
						<div class="fw-bold pb-2 text-ymwhite" style="font-size:60px;">내 주변 맛집을 찾아보세요</div>
						<div class="fs-4 text-ymwhite">다양한 카테고리와 리뷰로 완벽한 식사 장소를 발견하세요</div>
					</div>
				</div>
			</div>
		</div>
		<div class= container>
			<div class="row">
				<div class="col-4">
					<div class="row">
						<div class="col-3">
							<a th:href="@{/store/list}" class="btn btn-outline-secondary rounded-5 border-3 text-center">
								<i class="bi bi-0-circle" style="font-size: 2em; color: #007bff;"></i>
								<div class="fs-4 fw-bold">와쇼쿠</div>
							</a>
						</div>
					</div>
				</div>
				<div class="col-4">
					<th:block th:each="i : ${#numbers.sequence(1,5)}">
							<div class="row border border-3">
								<div class="col">
									<button type="button" class="btn btn-outline-dark" data-bs-toggle="modal" data-bs-target="#">
										<span>가게명</span>
										<span>별점</span>
										<span>n분전</span>
									</button>
								</div>
							</div>
						</th:block>
				</div>
				<div class="col-4">
					<th:block th:each="i : ${#numbers.sequence(1,5)}">
							<div class="row border border-3">
								<div class="col">
									<button type="button" class="btn btn-outline-dark" data-bs-toggle="modal" data-bs-target="#">
										<span>위치</span>
										<span>가게명</span>
										<span>카테고리</span>
										<span>같이먹기</span>
									</button>
								</div>
							</div>
						</th:block>
				</div>
			</div>
		</div>		
		<div class="bg-ymwhite py-5">
			<div class="container">
				<div class="row">
					<div class="col-9">
						<th:block th:each="i : ${#numbers.sequence(1,5)}">
							<div class="row border border-3">
								<div class="row">
									<div class="col">
										<button type="button" class="btn">사용자명</button>
									</div>
									<div class="col">
										<span>같이먹기</span>
									</div>
									<div class="col">
										<span>9월 15일</span>
									</div>
									
								</div>
								<button type="button" class="btn btn-outline-dark" data-bs-toggle="modal" data-bs-target="#">
									<span>가게명</span>
									<span>메뉴: 가격 별점</span>
									<span>임시내용 ...</span>
								</button>
							</div>
						</th:block>
					</div>
					<div class="col-2">
						<a th:href="@{/station}" class="text-decoration-none fs-4 text-ymsecondary">
							<ul class="list-unstyled text-center">
								<li>
									<i class="bi bi-bus-front" style="font-size: 1em;"></i>
								</li>
								<li>
									<span style="font-size: 15px;">정류장</span>
								</li>
							</ul>
						</a>
					</div>
				</div>
			</div>
		</div>
		<div class="bg-ymwhitesmoke py-5">
			<div class="container">
				<div class="row">
					<div class="col">
						<div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
							<div class="carousel-inner">
								<div class="carousel-item active" data-bs-interval="2000">
									<div class="row text-center">
										<div class="col-4 border border-2">
											
										</div>
										<div class="col-4">
											<a th:href="@{/store/list}"
												class="btn btn-outline-secondary rounded-5 border-3 text-center">
												<i class="bi bi-0-circle" style="font-size: 2em; color: #007bff;"></i>
												<div class="fs-4 fw-bold">와쇼쿠</div>
											</a>
										</div>
										<div class="col-4 border border-2">
											<a th:href="@{/store/list}"
												class="btn btn-outline-secondary rounded-5 border-3 text-center">
												<i class="bi bi-0-circle" style="font-size: 2em; color: #007bff;"></i>
												<div class="fs-4 fw-bold">와쇼쿠</div>
											</a>
										</div>
									</div>
								</div>
								<div class="carousel-item" data-bs-interval="2000">
									<div class="row text-center">
										<div class="col-4 border border-2">
											<a th:href="@{/store/list}"
												class="btn btn-outline-secondary rounded-5 border-3 text-center">
												<i class="bi bi-0-circle" style="font-size: 2em; color: #007bff;"></i>
												<div class="fs-4 fw-bold">와쇼쿠</div>
											</a>
										</div>
										<div class="col-4">
											<a th:href="@{/store/list}"
												class="btn btn-outline-secondary rounded-5 border-3 text-center">
												<i class="bi bi-0-circle" style="font-size: 2em; color: #007bff;"></i>
												<div class="fs-4 fw-bold">와쇼쿠</div>
											</a>
										</div>
										<div class="col-4 border border-2">
											<a th:href="@{/store/list}"
												class="btn btn-outline-secondary rounded-5 border-3 text-center">
												<i class="bi bi-0-circle" style="font-size: 2em; color: #007bff;"></i>
												<div class="fs-4 fw-bold">와쇼쿠</div>
											</a>
										</div>
									</div>
								</div>
							</div>
							<button class="carousel-control-prev" type="button"
								data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
								<span class="carousel-control-prev-icon" aria-hidden="true"></span>
								<span class="visually-hidden">Previous</span>
							</button>
							<button class="carousel-control-next" type="button"
								data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
								<span class="carousel-control-next-icon" aria-hidden="true"></span>
								<span class="visually-hidden">Next</span>
							</button>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="bg-ymwhite py-5">
			<div class="container">
				<div class="row">
					<div class="col text-center">
						<h1 th:text="맛집리스트">블럭이름</h1>
					</div>
				</div>
				<!-- <div class="row flexbox row-cols-3 g-4"> -->
				<div class="gap-4" style="display:grid; grid-template-columns: repeat(3,1fr);">
					<th:block th:each="item : ${#numbers.sequence(1,6)}"><!-- 임시로 number로 해뒀지만 실제로는 객체 배열이 와야합니다.-->
						<div class="bg-ymwhite p-4 my-3 border rounded-5 border-1">
							<a th:href="@{/store/detail}" class="text-start text-decoration-none text-ymsecondary">
								<div class="row">
									<div class="col">
										<img src="" class="card-img-top my-3" alt="...">
									</div>
								</div>
								<div class="row">
									<div class="col fs-3 fw-bold my-3 text-ymprimary" th:text="가게이름">가게이름요청</div>
								</div>
								<div class="row">
									<div class="fs-6 my-3" th:text="분류">분류요청</div>
								</div>
								<div class="row">
									<div class="fs-6 my-3" th:text="위치">위치요청</div>
								</div>
								<div class="row my-3 justify-content-start">
									<div class="col-2">별점</div>
									<div class="col-4">
										<th:block th:each="item : ${#numbers.sequence(1,5)}">
											<i class="bi bi-star-fill" style="font-size: 1em; color: gold;"></i>
										</th:block>
									</div>
									<div class="col-3">평가수</div>
									<div class="col-3">1234</div>
								</div>
							</a>
						</div>
					</th:block>
				</div>
			</div>
		</div>
	</section>
	<th:block th:replace="~{ layout/footer }"/>
</body>

</html>
