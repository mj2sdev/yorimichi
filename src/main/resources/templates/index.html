<!DOCTYPE html>
<html
	th:replace="~{layout/main :: params(~{::head/content()},~{::body/content()})}"
	xmlns:th="http://www.thymeleaf.org"
>
<head>
	<title th:text="#{index.title}"></title>
	<script defer src="/js/index/countup.js"></script>
	<script defer src="/js/index/category-infinite.js"></script>
	<script src="/js/station/page/index-mini.js" type="module"></script>
</head>

<body>
<div class="hero-compact hero-spacious mb-4">
	<div class="container">
		<div class="hero-stack text-center">
			<h1 class="hero-title-sm m-0" th:text="#{index.hero.title}"></h1>
			<p class="hero-sub-sm mt-2 mb-0" th:text="#{index.hero.subtitle}">
			</p>

			<div class="stats-bento">
				<div class="stat-card">
					<div class="stat-head">
						<span class="stat-icon"><i class="bi bi-star-fill"></i></span>
						<span th:text="#{index.stats.reviews}"></span>
					</div>
					<div>
						<span class="stat-value countup" data-format="comma"
							  th:attr="data-value=${stats?.reviewCount ?: 12843}"></span>
						<span class="stat-unit" th:text="#{index.stats.reviews.unit}"></span>
					</div>
				</div>

				<div class="stat-card">
					<div class="stat-head">
						<span class="stat-icon"><i class="bi bi-shop"></i></span>
						<span th:text="#{index.stats.stores}"></span>
					</div>
					<div>
						<span class="stat-value countup" data-format="comma"
							  th:attr="data-value=${stats?.storeCount ?: 8021}"></span>
						<span class="stat-unit" th:text="#{index.stats.stores.unit}"></span>
					</div>
				</div>

				<div class="stat-card">
					<div class="stat-head">
						<span class="stat-icon"><i class="bi bi-chat-dots"></i></span>
						<span th:text="#{index.stats.new_posts}"></span>
					</div>
					<div>
						<span class="stat-value countup"
							  th:attr="data-value=${stats?.todayComments ?: 57}"></span>
						<span class="stat-unit" th:text="#{index.stats.new_posts.unit}"></span>
					</div>
				</div>
			</div>
			</div>
	</div>

	<div class="hero-wave">
		<svg aria-hidden="true" preserveAspectRatio="none" viewBox="0 0 1440 60">
			<path d="M0,32 C240,72 480,-8 720,12 C960,32 1200,76 1440,20 L1440,60 L0,60 Z" fill="white"></path>
		</svg>
	</div>
</div>

<div class="container">
	<div class="row g-3 align-items-stretch row-tight">

		<div class="col-12 col-lg-4">
			<div class="card cat-card p-3 equal-rail rail-compact">
				<div class="d-flex justify-content-between align-items-center mb-2">
					<h5 class="m-0 fw-bold cat-title" th:text="#{index.category.title}"></h5>
					<a class="small cat-link" href="/category/list" th:text="#{index.category.show_all}"></a>
				</div>

				<div class="d-grid gap-2 rail-scroll" id="cat-list"
					 th:data-has-next="${categorySlice.hasNext}"
					 th:data-next-id="${categorySlice.nextId}"
					 th:data-size="${categorySlice.size}"
					 th:if="${categorySlice != null and !#lists.isEmpty(categorySlice.items)}">

					<a class="cat-btn"
					   th:each="category : ${categorySlice.items}"
					   th:href="@{/store/list(categoryId=${category.id})}">
						<span></span>
						<span class="fw-normal" th:text="${category.name}"></span>
						<i class="bi bi-chevron-right"></i>
					</a>

					<div aria-hidden="true" class="infinite-sentinel" id="cat-sentinel"></div>
				</div>

				<div class="text-muted small"
					 th:unless="${categorySlice != null and !#lists.isEmpty(categorySlice.items)}" th:text="#{index.category.empty}">
				</div>

				<hr class="my-3"/>

				<a class="btn btn-ymprimary w-100" href="/store/list" th:text="#{index.category.discover_more}">
				</a>
			</div>
		</div>

		<div class="col-12 col-lg-4">
			<div class="featured p-3 equal-rail rail-compact"
				 th:if="${recommendedStoreList != null and !#lists.isEmpty(recommendedStoreList)}">
				<a class="d-block text-decoration-none"
				   th:href="@{/store/{storeId}(storeId=${recommendedStoreList[0].id})}">
					<img class="thumb"
						 height="400"
						 th:alt="${recommendedStoreList[0].name}"
						 th:src="${recommendedStoreList[0].image?.url ?: 'https://picsum.photos/600/400?random=' + recommendedStoreList[0].id}"
						 width="600"/>
					<div class="fs-3 fw-bold text-ymprimary"
						 th:text="${recommendedStoreList[0].name}">
					</div>
					<div class="meta mt-1"
						 th:text="${recommendedStoreList[0].address?.roadAddressText ?: ''}">
						 <!-- #{index.featured.store.address} -->
					</div>
					<div class="desc" th:text="${recommendedStoreList[0].description}"></div>
					<div class="d-flex align-items-center gap-2 mt-2">
						<span class="badge-ym" th:text="#{index.featured.store.recommended}"></span>
						<span class="star" th:text="${recommendedStoreList[0].review.avgRating ?: '-'}"></span>
						<span class="text-muted small" th:if="${recommendedStoreList[0].review.avgRating != null}" th:text="#{store.info.rating.unit}"></span>
						<span class="text-muted small">·</span>
						<span class="text-muted small" th:text="${recommendedStoreList[0].review.reviewCount ?: 0}"></span>
						<span class="text-muted small" th:text="#{index.stats.reviews.unit}"></span>
					</div>
				</a>
			</div>

			<div class="text-muted small"
				 th:unless="${recommendedStoreList != null and !#lists.isEmpty(recommendedStoreList)}" th:text="#{index.featured.store.empty}">

			</div>
		</div>

		<div class="col-12 col-lg-4">
			<div class="card-ym p-3 station equal-rail rail-compact">
				<div class="d-flex justify-content-between align-items-center mb-2">
					<div class="fw-bold" th:text="#{index.station.title}"></div>
					<a class="btn btn-sm btn-ymprimary" href="/station" th:text="#{index.station.show_all}"></a>
				</div>

				<div class="list-group list-group-flush rail-scroll"
					 id="station"
					 th:data-has-next="${stationSlice?.hasNext ?: false}"
					 th:data-next-id="${stationSlice?.nextId}"
					 th:data-size="${stationSlice?.size ?: 0}"
					 th:if="${stationSlice != null and !#lists.isEmpty(stationSlice.items)}">

					<a class="list-group-item list-group-item-action d-flex gap-2 align-items-start"
					   th:attr="list-id=${item?.id}, data-type=${item?.type}"
					   th:each="item : ${stationSlice.items}"
					   th:href="${isReview} ? ${reviewUrl} : ${coeatUrl}"
					   th:with="
						isReview=${item?.type?.name() == 'REVIEW'},
						reviewUrl=@{/review/{reviewId}(reviewId=${item?.id})},
						coeatUrl=@{/coeat/{coeatId}(coeatId=${item?.id})}
					   ">

						<i class="bi" th:classappend="${isReview} ? ' bi-chat-dots mt-1' : ' bi-people mt-1'"></i>

						<div class="flex-grow-1">
							<div class="d-flex justify-content-between">
								<div class="fw-semibold">
									<span th:text="${isReview} ? '' : #{store.coeat.title}"></span>
									<!-- #{index.popular_stores.store.review} -->

									<span class="badge rounded-pill ms-2 small"
										  th:classappend="${item?.coeat?.status?.name() == 'OPEN' ? ' bg-success bg-opacity-10 text-success' :
																		   (item?.coeat?.status?.name() == 'CLOSED' ? ' bg-secondary bg-opacity-10 text-secondary'
																											 : ' bg-danger bg-opacity-10 text-danger')}"
										  th:if="${!isReview and item?.coeat?.status != null}"
										  th:text="${item?.coeat?.status?.name()}">
									</span>
								</div>

								<div class="text-muted small rel-time"
									 th:attr="data-iso=${#temporals.format(item?.createdAt, 'yyyy-MM-dd''T''HH:mm:ss')}"
									 th:text="${#temporals.format(item?.createdAt, 'MM/dd HH:mm')}">
								</div>
							</div>

							<div class="text-ymsecondary small mb-2 lh-base clamp-2"
								 th:attr="title=${isReview} ? (${item?.review?.content} ?: '') : (${item?.coeat?.title} ?: '')"
								 th:text="${isReview} ? (${item?.review?.content} ?: '') : (${item?.coeat?.title} ?: '')">
							</div>

							<div class="small text-muted"
								 th:if="${!isReview and item?.coeat?.meetingAt != null}">
								<i class="bi bi-calendar-event me-1"></i>
								<span th:text="${#temporals.format(item?.coeat?.meetingAt, 'MM/dd HH:mm')}"></span>
							</div>


							<div class="small"
								 th:if="${isReview and !#lists.isEmpty(item?.review?.foods)}">
								<span class="badge bg-light text-dark me-1"
									  th:each="food, iter : ${item?.review?.foods}"
									  th:if="${iter.index < 3}"
									  th:text="${food?.name ?: ''}"></span>
								<span class="text-muted"
									  th:if="${#lists.size(item?.review?.foods) > 3}"
									  th:text="${'+' + (#lists.size(item?.review?.foods) - 3)}"></span>
							</div>

							<div class="small text-muted">
								<span th:text="${item?.store?.name ?: '' }"></span>
								<!-- #{index.featured.store.name} -->

								<span th:if="${isReview and item?.review?.rating != null}"></span>
								<span class="text-warning"
									  th:if="${isReview and item?.review?.rating != null}"
									  th:text="${item.review.rating} + ' ' + #{store.info.rating.unit}"></span>

								<span th:if="${!isReview and (item?.coeat?.capacity != null
										   or item?.coeat?.approvedCount != null
										   or item?.coeat?.appliedCount != null)}"></span>
								<span th:if="${!isReview}">
									<span th:if="${item?.coeat?.capacity != null}">
										<span th:text="#{station.list.coeat.capacity}"></span>
										<span th:text="' ' + ${item.coeat.capacity}"></span>
									</span>
									<span th:if="${item?.coeat?.approvedCount != null}">
										<span th:if="${item?.coeat?.capacity != null}"></span>
										<span th:text="#{station.list.coeat.approved}"></span>
										<span th:text="' ' + ${item.coeat.approvedCount}"></span>
									</span>
									<span th:if="${item?.coeat?.appliedCount != null}">
										<span th:if="${item?.coeat?.capacity != null or item?.coeat?.approvedCount != null}"></span>
										<span th:text="#{station.list.coeat.applied}"></span>
										<span th:text="' ' + ${item.coeat.appliedCount}"></span>
									</span>
								</span>
							</div>

							<div class="small text-muted"
								 th:if="${!isReview and (item?.coeat?.viewCount != null or item?.coeat?.commentCount != null)}">
								<span th:if="${item?.coeat?.viewCount != null}">
									<i class="bi bi-eye me-1"></i><span th:text="${item?.coeat?.viewCount}"></span>
								</span>
								<span th:if="${item?.coeat?.viewCount != null and item?.coeat?.commentCount != null}"></span>
								<span th:if="${item?.coeat?.commentCount != null}">
									<i class="bi bi-chat-dots me-1"></i><span th:text="${item?.coeat?.commentCount}"></span>
								</span>
							</div>

						</div>
					</a>

					<div aria-hidden="true" class="infinite-sentinel" id="station-sentinel"></div>
				</div>

				<div class="list-group list-group-flush"
					 th:if="${stationSlice == null or #lists.isEmpty(stationSlice.items)}">
					<div class="list-group-item text-muted small" th:text="#{station.list.empty.title}"></div>
				</div>
			</div>
		</div>

	</div>
</div>

<div class="container my-3">
	<div class="text-center mb-3">
		<h2 class="fw-bold text-ymprimary" th:text="#{index.popular_stores.title}"></h2>
		<div class="text-muted" th:text="#{index.popular_stores.subtitle}"></div>
	</div>

	<div class="store-grid">
		<th:block th:each="store: ${recommendedStoreList}"
				  th:if="${recommendedStoreList != null and !#lists.isEmpty(recommendedStoreList)}">
			<a class="text-decoration-none"
			   th:href="@{/store/{storeId}(storeId=${store.id})}">
				<div class="store-card">
					<img class="thumb"
						 height="400"
						 th:alt="${store.name}"
						 th:src="${store.image?.url ?: 'https://picsum.photos/600/400?random=' + store.id}"
						 width="600"/>
					<div class="name" th:text="${store.name}"></div>
					<div class="addr"
						 th:text="${store.address != null ? store.address.roadAddressText : '' }">
						 <!-- #{index.popular_stores.store.address} -->
					</div>
					<div class="desc" th:text="${store.description}"></div>
					<div class="d-flex align-items-center gap-2 mt-2">
						<span class="star" th:text="${store.review.avgRating ?: '-'}"></span>
						<span class="text-muted small" th:if="${store.review.avgRating != null}" th:text="#{store.info.rating.unit}"></span>
						<span class="text-muted small">·</span>
						<span class="text-muted small" th:text="${store.review.reviewCount ?: 0}"></span>
						<span class="text-muted small" th:text="#{index.popular_stores.store.review}"></span>
					</div>
				</div>
			</a>
		</th:block>
	</div>
</div>
  <!-- ===== CountUp (히어로 KPI 숫자 애니메이션) ===== -->
  <script>
  (() => {
    const DURATION = 1200;           // 전체 재생시간(ms)
    const STAGGER  = 120;            // 요소 사이 지연(ms)
    const EASE = t => 1 - Math.pow(1 - t, 3); // easeOutCubic

    const format = (n, el) => {
      if (el?.dataset.format === 'comma') return n.toLocaleString();
      return String(n);
    };

    function runCount(el, delay = 0) {
      const target = Number(el.dataset.value || el.textContent || 0);
      if (!isFinite(target)) return;

      const start = performance.now() + delay;
      const from  = 0;
      const dec   = Math.pow(10, (el.dataset.decimals|0));
      const duration = Number(el.dataset.duration || DURATION);

      function tick(now) {
        if (now < start) { requestAnimationFrame(tick); return; }
        const t = Math.min(1, (now - start) / duration);
        const eased = EASE(t);
        const current = Math.round((from + (target - from) * eased) * dec) / dec;
        el.textContent = format(current, el);
        if (t < 1) requestAnimationFrame(tick);
        else el.textContent = format(target, el);
      }
      requestAnimationFrame(tick);
    }

    function boot() {
      const els = Array.from(document.querySelectorAll('.countup'))
                        .filter(el => !el.dataset.counted);
      if (els.length === 0) return;

      if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const idx = els.indexOf(entry.target);
              runCount(entry.target, idx * STAGGER);
              entry.target.dataset.counted = '1';
              io.unobserve(entry.target);
            }
          });
        }, { threshold: 0.6 });
        els.forEach(el => io.observe(el));
      } else {
        els.forEach((el, i) => runCount(el, i * STAGGER));
      }
    }

    document.readyState === 'loading'
      ? document.addEventListener('DOMContentLoaded', boot)
      : boot();
  })();
  </script>
  <script th:src="@{/js/index/search.js}" defer></script>
  <script th:src="@{/js/feed.js}" defer></script>
</body>
</html>
