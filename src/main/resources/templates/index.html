<!DOCTYPE html>
<html th:replace="~{layout/main :: params(~{::head/content()},~{::body/content()})}" xmlns:th="http://www.thymeleaf.org">

<head>
	<title> Yorimichi Project </title>

<!--작성해야 하는 스크립트 리스트
2.피드를 불러와야함.(비동기, 자동(타이머)) 피드에 같이먹기 리스트랑 리뷰 리스트를 동시에 담을 수 있는 DTO가 필요한 것 같음.
아니면, 따로따로 가져와서 객체배열로 합치고 각 객체의 작성시간을 비교해다가 정렬해서 화면에 띄워야 함.
-->
<script defer src="/js/feed.js"></script>
<script defer src="/js/indexstorelist.js"></script> <!--인기 맛집 리스트 불러오기.js 비동기, 자동(타이머)&&수동(버튼)) 수동 만들어야함.-->
</head>

<body>
	<h1 th:text="${message}">Welcome!</h1>
	<section>
		<div class="bg-ymprimary py-5 bg-gradient">
			<div class="container-fluid">
				<div class="row">
					<div class="col text-center">
						<div class="fw-bold pb-2 text-ymwhite" style="font-size:60px;">내 주변 맛집을 찾아보세요</div>
						<div class="fs-4 text-ymwhite">다양한 카테고리와 리뷰로 완벽한 식사 장소를 발견하세요</div>
					</div>
				</div>
			</div>
		</div>
		<!-- 클릭시 /store/list로 이동시키기. -->
		<div class= container>
			<div class="row">
				<div class="col-4">
					<div class="row">
						<div class="col">
							<button class="btn border border-1" type="button" >
								더 다양한 즐거움을 발견해요
							</button>
						</div>	
					</div>
					<th:block th:each="category : ${#numbers.sequence(1,3)}">
					<div class="row py-3">
						<div class="col-4">
							<a th:href="@{/store/list}" class="btn btn-outline-secondary rounded-5 border-3 text-center">
								<i class="bi bi-0-circle" style="font-size: 2em; color: #007bff;"></i>
								<div class="fs-4 fw-bold">와쇼쿠</div>
							</a>
						</div>
					</div>
					</th:block>
				</div>
				<!-- 누르면 버튼들을 애니메이션과 함께 치워버리고 하단에 있는 인기 맛집 리스트를 보이게 바꾸고 애니메이션으로 다시 보이게 한다.-->
				<!-- 스크롤이 아닌 버튼식으로 해야하는 게 좋을 거 같은 이유. 최상단에서 살짝 스크롤 했다고 인기 맛집으로 넘어가버릴 거 같음. -->
				<div class="col-4 p-3">
					<div class="row px-3 border border-2">
						<div class="col">
							지금 인기 있는 가게를 찾아가요
						</div>
					</div>
					<div class="bg-ymwhite p-4 my-3 border rounded-5 border-1">
						<a th:href="@{/store/detail}" class="text-start text-decoration-none text-ymsecondary">
							<div class="row">
								<div class="col">
									<img src="" class="card-img-top my-3" alt="...">
								</div>
							</div>
							<div class="row">
								<div class="col fs-3 fw-bold my-3 text-ymprimary" th:text="가게이름">가게이름요청</div>
							</div>
							<div class="row">
								<div class="fs-6 my-3" th:text="분류">분류요청</div>
							</div>
							<div class="row">
								<div class="fs-6 my-3" th:text="위치">위치요청</div>
							</div>
							<div class="row my-3 justify-content-start">
								<div class="col-2">별점</div>
								<div class="col-4">
									<th:block th:each="item : ${#numbers.sequence(1,5)}">
										<i class="bi bi-star-fill" style="font-size: 1em; color: gold;"></i>
									</th:block>
								</div>
								<div class="col-3">평가수</div>
								<div class="col-3">1234</div>
							</div>
						</a>
					</div>
				</div>
				<div class="col-4">
					<div class="row">
						<div class="col">
							<a th:href="@{/station/list}" class="text-decoration-none fs-4 text-ymsecondary">
							<ul class="list-unstyled text-center">
								<li>
									<i class="bi bi-bus-front" style="font-size: 1em;"></i>
								</li>
								<li>
									<span style="font-size: 15px;">정류장에서 더 많은 사람과 만나요</span>
								</li>
							</ul>
						</a>
						</div>
					</div>
					<!--일정 시간마다 피드가 최신 것으로 갱신된다. 누르면 정류장으로 이동시킴.-->
					<div class="row">
						<div class="col feed">
							<button type="button" class="btn btn-outline-dark" data-bs-toggle="modal" data-bs-target="#">
								<span class="feed-address">위치</span>
								<span class="feed-store-name">가게명</span>
								<span class="feed-store-category">카테고리</span>
								<span class="feed-category">같이먹기</span>
							</button>
						</div>
					</div>
				</div>
			</div>
		</div>		
		<div class="bg-ymwhite py-5">
			<div class="container">
				<!-- 인기 맛집 리스트는 일정 시간마다 비동기로 새로고침 되며, 새로고침 버튼도 둬서 사용자가 갱신할 수 있도록 한다.-->
				<div class="row">
					<div class="col text-center">
						<h1 th:text="인기맛집">인기 맛집</h1> 
					</div>
				</div>
				<!-- <div class="row flexbox row-cols-3 g-4"> -->
				<div class="storeList gap-4" style="display:grid; grid-template-columns: repeat(3,1fr);">
				</div>
			</div>
		</div>
	</section>
	<th:block th:replace="~{ fragments/index/storelist/template :: template }"/>
	<th:block th:replace="~{ fragments/index/feed/template :: template }"/>
</body>
</html>
