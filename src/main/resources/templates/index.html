<!DOCTYPE html>
<html
    th:replace="~{layout/main :: params(~{::head/content()},~{::body/content()})}"
    xmlns:th="http://www.thymeleaf.org"
>
<head>
  <title>Yorimichi Project</title>

  <!-- 인덱스 전용 스크립트 -->
  <script defer src="/js/index/countup.js"></script>

</head>

<body>
<!-- ===================== Hero ===================== -->
<div class="hero-compact hero-spacious mb-4">
  <div class="container">
    <div class="hero-stack text-center">
      <h1 class="hero-title-sm m-0">내 주변 맛집을 빠르게 찾아보세요</h1>
      <p class="hero-sub-sm mt-2 mb-0">
        카테고리·리뷰·정류장 피드를 한곳에서. 오늘의 인기 가게도 바로 확인!
      </p>

      <!-- ===== KPIs ===== -->
      <div class="stats-bento">
        <!-- 누적 리뷰 -->
        <div class="stat-card">
          <div class="stat-head">
            <span class="stat-icon"><i class="bi bi-star-fill"></i></span>
            <span>누적 리뷰</span>
          </div>
          <div>
              <span class="stat-value countup"
                    data-format="comma"
                    th:attr="data-value=${stats?.reviewCount ?: 12843}">0</span>
            <span class="stat-unit">리뷰</span>
          </div>
        </div>

        <!-- 등록 가게 -->
        <div class="stat-card">
          <div class="stat-head">
            <span class="stat-icon"><i class="bi bi-shop"></i></span>
            <span>등록 가게</span>
          </div>
          <div>
              <span class="stat-value countup"
                    data-format="comma"
                    th:attr="data-value=${stats != null ? stats.storeCount : 8021}">0</span>
            <span class="stat-unit">곳</span>
          </div>
        </div>

        <!-- 오늘의 새 글 -->
        <div class="stat-card">
          <div class="stat-head">
            <span class="stat-icon"><i class="bi bi-chat-dots"></i></span>
            <span>오늘의 새 글</span>
          </div>
          <div>
              <span class="stat-value countup"
                    th:attr="data-value=${stats != null ? stats.todayComments : 57}">0</span>
            <span class="stat-unit">개</span>
          </div>
        </div>
      </div>
      <!-- /KPIs -->
    </div>
  </div>

  <!-- Wave Divider -->
  <div class="hero-wave">
    <svg aria-hidden="true" preserveAspectRatio="none" viewBox="0 0 1440 60">
      <path d="M0,32 C240,72 480,-8 720,12 C960,32 1200,76 1440,20 L1440,60 L0,60 Z" fill="white"></path>
    </svg>
  </div>
</div>

<!-- ===================== 상단 3열: 카테고리 / 추천 / 미니정류장 ===================== -->
<div class="container">
  <div class="row g-3 align-items-stretch row-tight">
    <!-- 좌: 카테고리 -->
    <div class="col-12 col-lg-4">
      <div class="card cat-card p-3 equal-rail rail-compact">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="m-0 fw-bold cat-title">카테고리로 이동</h5>
          <a class="small cat-link" href="/category/list">전체보기</a>
        </div>

        <div class="d-grid gap-2 rail-scroll"
             th:if="${popularCategories != null and !#lists.isEmpty(popularCategories)}">
          <a class="cat-btn"
             th:each="c : ${popularCategories}"
             th:href="@{/store/list(categoryId=${c.id})}">
            <span>•</span>
            <span class="fw-normal" th:text="${c.name}">카테고리명</span>
            <i class="bi bi-chevron-right"></i>
          </a>
        </div>

        <div class="d-grid gap-2 rail-scroll" th:if="${!#lists.isEmpty(popularCategories)}">…</div>
        <div class="text-muted small" th:unless="${!#lists.isEmpty(popularCategories)}">
          아직 등록된 카테고리가 없어요.
        </div>

        <hr class="my-3">

        <a class="btn btn-ymprimary w-100" href="/store/list">
          더 다양한 즐거움을 발견해요
        </a>
      </div>
    </div>

    <!-- 중: 추천(Featured) -->
    <div class="col-12 col-lg-4">
      <div class="featured p-3 equal-rail rail-compact">
        <a class="d-block text-decoration-none"
           th:href="@{/store/detail(id=${recommendedStoreList[0].id})}"
           th:if="${recommendedStoreList != null and !#lists.isEmpty(recommendedStoreList)}">

          <img class="thumb"
               height="400"
               th:alt="${recommendedStoreList[0].name}"
               th:src="${recommendedStoreList[0].image != null and recommendedStoreList[0].image?.url != null
               ? recommendedStoreList[0].image?.url
               : 'https://picsum.photos/600/400?random=' + recommendedStoreList[0].id}"
               width="600"/>

          <div class="fs-3 fw-bold text-ymprimary"
               th:text="${recommendedStoreList[0].name}">가게이름
          </div>
          <div class="meta mt-1"
               th:text="${recommendedStoreList[0].address != null ? recommendedStoreList[0].address.roadAddressText : '주소 정보 없음'}">
            주소
          </div>

          <div class="desc" th:text="${recommendedStoreList[0].description}">설명</div>

          <div class="d-flex align-items-center gap-2 mt-2">
            <span class="badge-ym">추천</span>
            <span class="star">★</span>
            <span class="text-muted small" th:text="${recommendedStoreList[0].review.avgRating}">4.5</span>
            <span class="text-muted small">·</span>
            <span class="text-muted small" th:text="${recommendedStoreList[0].review.reviewCount}">123 리뷰</span>
          </div>
        </a>

        <div class="text-muted small"
             th:if="${recommendedStoreList == null or #lists.isEmpty(recommendedStoreList)}">
          아직 인기 상점 데이터가 없습니다 🥲
        </div>
      </div>
    </div>

    <!-- 우: 미니 정류장 -->
    <div class="col-12 col-lg-4">
      <div class="card-ym p-3 mini-station equal-rail rail-compact">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="fw-bold">정류장에서 더 많은 사람과 만나요</div>
          <a class="btn btn-sm btn-ymprimary" href="/station">전체보기</a>
        </div>
        <div class="list-group list-group-flush rail-scroll" id="mini-station">
          <!-- feed.js 가 채움 -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===================== 하단: 인기 맛집 그리드 ===================== -->
<div class="container my-3">
  <div class="text-center mb-3">
    <h2 class="fw-bold text-ymprimary">인기 맛집</h2>
    <div class="text-muted">리뷰/별점/조회수를 기반으로 추천해요</div>
  </div>

  <div class="store-grid">
    <th:block th:each="store, iter : ${recommendedStoreList}"
              th:if="${recommendedStoreList != null and !#lists.isEmpty(recommendedStoreList)}">
      <a class="text-decoration-none" th:href="@{/store/detail(id=${store.id})}">
        <div class="store-card">

          <img class="thumb"
               height="400"
               th:alt="${store}"
               th:src="${store.image != null and store.image?.url != null
               ? store.image?.url
               : 'https://picsum.photos/600/400?random=' + iter.count}"
               width="600"/>

          <div class="name" th:text="${store.name}">가게이름</div>
          <div class="addr"
               th:text="${store.address != null ? store.address.roadAddressText : '주소 없음'}">주소
          </div>
          <div class="desc" th:text="${store.description}">설명</div>

          <div class="d-flex align-items-center gap-2 mt-2">
            <span class="badge-ym">추천</span>
            <span class="star">★</span>
            <span class="text-muted small" th:text="${store.review.avgRating}">4.5</span>
            <span class="text-muted small">·</span>
            <span class="text-muted small" th:text="${store.review.reviewCount}">123 리뷰</span>
          </div>
        </div>
      </a>
    </th:block>
  </div>
</div>

</body>
</html>
