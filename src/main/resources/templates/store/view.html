<!DOCTYPE html>
<html th:replace="~{layout/layout :: layout(~{::title},~{::section},~{::script})}" xmlns:th="http://www.thymeleaf.org">

<head>
	<title> Yorimichi Project </title>
</head>

<body>
	<section>
		<div class="container my-4">
			<div class="row justify-content-between">
				<div class="col-3 border border-2 p-2" aria-label="sub">
					<div class="row" aria-label="map">
						<div class="col" style="position: relative;">
							<div class="ratio ratio-4x3">
								<iframe
									src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2272.926378741515!2d127.40430498927147!3d36.32677405031281!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x356549343c3c3cf1%3A0x9d6af658336f953a!2z7KCc7J207JeQ7Iqk7JeY7J247J6s6rCc67Cc7JuQKOyjvCk!5e0!3m2!1sko!2skr!4v1757573926145!5m2!1sko!2skr"
									style="border:0;" allowfullscreen="" loading="lazy"
									referrerpolicy="no-referrer-when-downgrade">
								</iframe>
							</div>
						</div>
					</div>
					<div class="row py-4">
						<div class="col">
							<ul class="list-group list-unstyled">
								<li class="text-center">
									메뉴
								</li>
								<th:block th:each="item : ${#numbers.sequence(1,5)}">
									<li class="text-start">
										짜장면
										3000￦
										<th:block th:each="item : ${#numbers.sequence(1,5)}">
											<i class="bi bi-star-fill" style="font-size: 1em; color: gold;"></i>
										</th:block>
									</li>
								</th:block>
							</ul>
						</div>
					</div>
				</div>
				<div class="col-8 border border-2 p-2" aria-label="main">
					<div class="row">
						<div class="col pb-4">
							<div id="shop-image-carousel" class="carousel slide">
								<div class="carousel-inner" style="height: 280px;">
									<div class="carousel-item active">
										<!--objectfitcover-->
										<img src="https://picsum.photos/280">
										<img src="https://picsum.photos/280">
										<img src="https://picsum.photos/280">
									</div>
									<div class="carousel-item">
										<img src="https://picsum.photos/280">
										<img src="https://picsum.photos/280">
										<img src="https://picsum.photos/280">
									</div>
									<div class="carousel-item">
										<img src="https://picsum.photos/280">
										<img src="https://picsum.photos/280">
										<img src="https://picsum.photos/280">
									</div>
								</div>
								<button class="carousel-control-prev" type="button"
									data-bs-target="#shop-image-carousel" data-bs-slide="prev">
									<span class="carousel-control-prev-icon" aria-hidden="true"></span>
									<span class="visually-hidden">Previous</span>
								</button>
								<button class="carousel-control-next" type="button"
									data-bs-target="#shop-image-carousel" data-bs-slide="next">
									<span class="carousel-control-next-icon" aria-hidden="true"></span>
									<span class="visually-hidden">Next</span>
								</button>
							</div>
						</div>
					</div>
					<div class="row justify-content-between" aria-label="storename">
						<div class="col">
							<div>가게이름 본점</div>
						</div>
						<div class="col text-end">
							<button type="button" class="btn"><i class="bi bi-heart border border-3 rounded-pill p-2" style="font-size: 1em;">저장</i></button>
							<button type="button" class="btn"><i class="bi bi-star border border-3 rounded-pill p-2" style="font-size: 1em;">즐겨찾기</i></button>
							<button type="button" class="btn"><i class="bi bi-share border border-3 rounded-pill p-2" style="font-size: 1em;">공유</i></button>
						</div>
					</div>
					<div class="row">
						<div class="col-3">
							<th:block th:each="item : ${#numbers.sequence(1,5)}">
								<i class="bi bi-star-fill" style="font-size: 1em; color: gold;"></i>
							</th:block>
						</div>
						<div class="col">
							5점 (142명의 평가)
						</div>
					</div>
					<div class="row">
						<div class="col">
							<i class="bi bi-pin text-ymesecondary" style="font-size: 1em;">대전광역시 중구 용두동 어쩌구6길 14</i>
						</div>
						<div class="col text-end">
							<button class="btn border border-2 btn-ymprimary" data-bs-toggle="modal" data-bs-target="#reviewwriting">
								리뷰작성
							</button>
						</div>
					</div>
					<div class="row">
						<div class="col-3">
							<i class="bi bi-telephone" style="font-size: 1em;">010-1234-5678</i>
						</div>
						<div class="col">
							<button type="button" class="btn position-relative" data-bs-toggle="collapse"
								data-bs-target="#collapseExample" aria-expanded="false" aria-controls="collapseExample">
								<i class="bi bi-watch text-ymsecondary" style="font-size: 1em;">
									영업중 오늘(수) 영업시간: 11:00~22:00
								</i>
							</button>
							<!-- 영업일, 영업시간 드롭다운 넣기-->
							<div class="collapse position-absolute" id="collapseExample">
								<div class="card card-body" style="width:100%">
									월요일 영업시간: 11:00~22:00
								</div>
							</div>
						</div>
					</div>
					<div class="row">
						<div class="col">
							<i class="bi bi-tag" style="font-size: 1em;"></i>
						</div>
						<th:block th:each="item : ${#numbers.sequence(1,6)}">
							<div class="col ">
								<a href="" th:text="'#'+${item}" class="text-decoration-none text-ymsecondary"></a>
							</div>
						</th:block>
					</div>
				</div>
			</div>
		</div>
		<div class="container">
			<div class="row justify-content-between">
				<div class="col-3 border border-2 p-2" aria-label="coeatList">
					<div class="row py-3">
						<div class="col text-center">
							<button type="button" class="btn border border-2 btn-ymprimary" data-bs-toggle="modal" data-bs-target="#coeatwriting">
								같이먹기
							</button>
						</div>
						<div class="col">
							<input type="checkbox"> 팔로우만
						</div>
					</div>
					<th:block th:each="i : ${#numbers.sequence(1,5)}">
						<ul class="list-unstyled">
							<li class="border border-2 p-2">
								<button type="button" class="btn dropdown-item" data-bs-toggle="modal"
									data-bs-target="#coeatmodal">
									<div class="row ">
										<!--전체 구인인지, 내 팔로우 구인인지.-->
										<div class="col-1"><i class="bi bi-globe" style="font-size: 1em;"></i></div>
										<div class="col">작성자</div>
										<div class="col">일자</div>
									</div>
								</button>
							</li>
						</ul>
					</th:block>
				</div>
				<div class="col-8 border border-2 bg-ymwhitesmoke" aria-label="reviews">
					<div class="row my-3">
						<div class="col">
							<i class="bi bi-compass text-ymprimary" style="font-size: 1em;">ai요약: </i>
							이 집은 물을 잘해요!
						</div>
					</div>
					<th:block th:each="reviewItem : ${#numbers.sequence(1,5)}">
						<div class="row bg-ymwhite mb-3">
							<div class="col-3 border">
								<span>이미지</span>
							</div>
							<div class="col-9 border">
								<div class="row justify-content-between align-items-center">
									<div class="col-auto dropdown">
										<button class="btn fw-bold dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">작성자</button>
										<ul class="dropdown-menu">
											<li><a class="dropdown-item" href="#"><i class="bi bi-heart" style="font-size: 1em;"></i>팔로우</a></li>
											<li th:if="${#false}"><a class="dropdown-item" href="#"><i class="bi bi-heart-fill" style="font-size: 1em; color: red;"></i>팔로우취소</a></li>
											<li><a class="dropdown-item" href="/user/info"><i class="bi bi-search" style="font-size: 1em;"></i> 상세보기</a></li>
										</ul>
									</div>
									<div class="col">
										<span th:each="star : ${#numbers.sequence(1,5)}">
											<i class="bi bi-star-fill" style="font-size: 1em; color: gold;"></i>
										</span>
									</div>
									<div class="col-auto">
										2025.09.15
									</div>
									<div class="col-auto">
										<button type="button" class="btn btn-sm p-0"
											data-bs-toggle="modal" data-bs-target="#reportModal">
											<i class="bi bi-flag-fill" style="font-size: 1em; color: red;"></i>
										</button>
										<button th:if="${#false}" type="button" class="btn btn-sm p-0"
											data-bs-toggle="modal" data-bs-target="#reviewwriting">
											<i class="bi bi-pencil-fill text-ymprimary" style="font-size: 1em;"></i>
										</button>	
									</div>
								</div>
								<div class="p-2" data-bs-toggle="collapse"
									th:attr="data-bs-target='#menu' + ${reviewItem}">
									<div class="row mt-2">
										<div class="col">
											리뷰 본문 내용...
										</div>
									</div>
								</div>
								<div class="collapse" th:id="'menu' + ${reviewItem}">
									<div class="card card-body">
										메뉴 내용...
									</div>
								</div>
							</div>
						</div>
					</th:block>
				</div>
			</div>
		</div>
	</section>
</body>

</html>
