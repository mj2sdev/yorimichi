# 서버 포트
server:
  port: 8080

# spring 설정 시작
spring:
  application:
    name: yorimichi
  servlet:
    multipart:
      max-file-size: 25MB      # 파일 하나 최대 크기
      max-request-size: 25MB   # 요청 전체(여러 파트) 최대 크기
  profiles:
    group:
      oauth-drive: local-drive-test,oauth-drive-only
  config:
    activate:
      on-profile: oauth-drive-only
  web:
    resources:            # ✅ plural
      add-mappings: false

  # MySQL 데이터베이스 연결 설정
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://yorimichi.duckdns.org:3306/yorimichi?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    # mysql에서 db와 서버의 시간이 다른 경우 문제가 발생할 수 있어서 시간대를 명시하게 함.
    username: jsl3team
    password: # [wi-fi password]
  # Thymeleaf 설정
  # 캐시를 저장하지 않게 해둬서 변경시 바로바로 확인 가능
  thymeleaf:
    cache: false

  # Spring Security 임시 사용자 설정
  security:
    user:
      name: admin
      password: 1234



mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mappers/**/*.xml
  type-aliases-package: com.jslhrd.yorimichi.domain


google:
  drive:
    folder-id: 1zmXzxFMUcpvM4n08f3sv8UB4l9U_yd1J 
    upload-folder-id: 1zmXzxFMUcpvM4n08f3sv8UB4l9U_yd1J
  oauth:
    redirect-uri: "http://localhost:8080/oauth2/callback"

