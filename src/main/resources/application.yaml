# MyBatis 설정 (패키지 경로는 실제 프로젝트에 맞게 수정)
# dto 위치 기본적으로 설정해서 xml에서 DTO클래스 이름만 적어도 되게 해줌.
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mappers/**/*.xml
  type-aliases-package: com.jslhrd.yorimichi.domain


google:
  drive:
    credentials-file-path: /credentials.json
    token-path: tokens
    folder-id: 1zmXzxFMUcpvM4n08f3sv8UB4l9U_yd1J

gemini:
  mime-type: application/json
  model: gemini-2.5-flash
  




