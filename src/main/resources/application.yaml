server:
  port: 8080

spring:
  application:
    name: yorimichi
  servlet:
    multipart:
      max-file-size: 25MB      # 파일 하나 최대 크기
      max-request-size: 25MB   # 요청 전체(여러 파트) 최대 크기

  # MySQL 데이터베이스 연결 설정
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://yorimichi.duckdns.org:3306/yorimichi?serverTimezone=Asia/Seoul&characterEncoding=UTF-8

    # mysql에서 db와 서버의 시간이 다른 경우 문제가 발생할 수 있어서 시간대를 명시하게 함.
    username: jsl3team
    password: ${DB_PASSWORD:} #[701 wi-fi password]

  # Thymeleaf 설정
  # 캐시를 저장하지 않게 해둬서 변경시 바로바로 확인 가능
  thymeleaf:
    cache: false

# MyBatis 설정 (패키지 경로는 실제 프로젝트에 맞게 수정)
# dto 위치 기본적으로 설정해서 xml에서 DTO클래스 이름만 적어도 되게 해줌.
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mappers/**/*.xml
  type-aliases-package: com.jslhrd.yorimichi.domain


google:
  drive:
    credentials-file-path: /credentials.json
    token-path: tokens
    folder-id: 1Awhy7q0VebD8X1w9QaQ6S-U6gd3Wsm-A
    image-path-prefix: https://lh3.googleusercontent.com/d/

gemini:
  mime-type: application/json
  model: gemini-2.5-flash
  




