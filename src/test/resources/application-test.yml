spring:
  datasource:
    url: jdbc:h2:mem:yorimichi;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      # schema.sql, data.sql을 항상 실행 (테스트 시작시 테이블 생성)
      mode: always

mybatis:
  # main/resources/mapper/*.xml (네가 만든 경로) 를 읽게 함
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    # DB 컬럼 스네이크 → DTO 카멜케이스 자동 매핑 (user_id -> userId)
    map-underscore-to-camel-case: true
    # (선택) SQL 로그 보고 싶으면 주석 해제
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
